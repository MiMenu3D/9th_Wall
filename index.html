<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Google AI Studio 4.62</title>
<!-- version 4.62 -->

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
#prueba {
  font-size: 22px;
  color: white;
  text-shadow: 0 0 10px black;
  margin-bottom: 12px;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  background: #1f1a17;
}

/* v4.62: Bloqueador visual de orientación vertical (Landscape Warning Overlay) */
#orientationBlocker {
  display: none;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: #1f1a17;
  z-index: 1000005;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 24px;
  box-sizing: border-box;
}

@media screen and (orientation: landscape) {
  #orientationBlocker {
    display: flex;
  }
}

#mvContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 40%;
  background: #1f1a17;
  z-index: 40;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
  filter: saturate(0.87) contrast(0.88);
  opacity: 0;
  transition: opacity 0.5s ease;
}

#startScreen {
  position: fixed;
  top: 40%;
  left: 0;
  right: 0;
  bottom: 0;
  background: url("Loading screen.png") center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 20%;
  z-index: 30;
}

.arrowContainer { display:flex; gap:20px; margin-bottom:10px; }

.arrow {
  font-size: 28px;
  padding: 10px 16px;
  background: rgba(255,255,255,0.9);
  border-radius: 12px;
  border: none;
  cursor: pointer;
}

.button {
  background: white;
  color: black;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="orientationBlocker">
  <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;">
    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
    <line x1="12" y1="18" x2="12.01" y2="18"></line>
    <path d="M17 6h2a2 2 0 0 1 2 2v2"></path>
    <path d="M7 6H5a2 2 0 0 0-2 2v2"></path>
  </svg>
  <div style="font-size:18px; font-weight:bold; margin-bottom:8px;">Gira tu dispositivo</div>
  <div style="font-size:14px; opacity:0.8;">Por favor, coloca el teléfono en posición vertical para continuar.</div>
</div>

<div id="mvContainer"></div>

<div id="startScreen">
  <div id="prueba">Google AI Studio 4.62</div>
  <div id="label">Plato 01</div>

  <div class="arrowContainer">
    <button class="arrow" onclick="prev()">&#8592;</button>
    <button class="arrow" onclick="next()">&#8594;</button>
  </div>

  <button class="button" onclick="startAR()">Ver en tu mesa</button>
</div>

<script src="menu.js"></script>
</body>
</html>
