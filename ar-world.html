<!-- 9th Wall v3.08 Apple Probe -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v3.08<br>
      bundle: v3.08<br>
      <span id="latencySpan" style="color:#0f0;">Latencia: -- ms</span>
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Env: CAM
  </button>

  <button id="debugToggle"
    style="position:fixed;bottom:20px;left:130px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Debug: OFF
  </button>

  <script>
    // =====================================================================================
    // === CONTROL DE ILUMINACIÓN (Consola Central de Calibración v3.08) ===
    // =====================================================================================
    const LIGHTING_CONFIG = {
      // --- INTENSIDADES Y MULTIPLICADORES BASE (CERO ESTRICTO EN OSCURIDAD) ---
      light1_intensity: 0.00,        // Luz 1 (ECS Ground / Contact AO): 0.00 para sombra pura sin doble iluminación
      light2_maxIntensity: 6.50,     // Luz 2 (Clave / Especular): Intensidad base para interiores equilibrados
      light3_baseIntensity: 4.50,    // Luz 3 (Relleno móvil independiente): Intensidad base desacoplada de Luz 2
      
      // --- SOBREIMPULSO POR FUENTES DIRECTAS POTENTES / EXTERIOR (> 235) ---
      boost_lum_threshold: 235,      // Umbral de luminancia para activar sobreimpulso (235-255)
      boost_multiplier: 1.80,        // Multiplicador máximo de potencia en fuentes de luz solar/focos directos
      
      // --- SOMBRAS DINÁMICAS ---
      light1_castShadow: true,       // Sombra de contacto base en el suelo (Ground)
      light2_castShadow: false,      // Sombra secundaria de Luz 2 (Desactivada para rendimiento)
      light3_castShadow: false,      // Sombra de Luz 3 (Falsa: luz de relleno puro sin coste GPU)
      
      // --- RESTRICCIONES ESPACIALES Y ANCLAJE SLAM (v3.08) ---
      light2_distance: 2.2,          // Distancia de proyección a lo largo del rayo de cámara
      min_light_height: 0.25,        // Altura mínima obligatoria sobre el plano de la mesa (25 cm)
      max_light_radius: 2.0,         // Radio espacial máximo de distancia respecto al centro [0,0,0] (2 metros)
      light3_default_pos: [1.3, 0.25, 0.0], // Posición inicial derecha de Luz 3 [X, Y >= 25cm, Z]
      min_separation_angle: 0.52,    // Separación angular mínima (~30º) para anclar segundo foco
      transition_duration_ms: 1000,  // Duración de la transición suave al reubicar luces (1000 ms)
      
      // --- AMBIENTE, TONE MAPPING Y CROMINANCIA CONTROLADA ---
      exposure_base: 0.00,           // Exposición en oscuridad total (cero estricto)
      exposure_mult: 1.45,           // Multiplicador de exposición ambiental equilibrado (sin probe artificial)
      chroma_tint_strength: 0.40,    // Margen cromático (40% color real detectado, 60% blanco para no teñir comida)
      
      // --- LIGHT ESTIMATION: RESOLUCIÓN Y ESCANEO COMPLETO (100%) ---
      pmrem_resolution: 128,         // Tamaño del canvas PMREM (128x128 píxeles)
      pmrem_interval_ms: 150,        // Frecuencia de actualización de la textura PMREM (cada 150 ms)
      scan_interval_ms: 250,         // Frecuencia de escaneo a pantalla completa (cada 250 ms)
      scan_height_ratio: 1.00,       // Porcentaje vertical analizado (100% = mesa y entorno completo)
      scan_pixel_step: 16,           // Paso de muestreo en bytes (16 bytes = cada 4 píxeles para alta resolución)
      obvious_lum_threshold: 215     // Umbral de luminancia (0-255) para considerar una fuente directa "obvia"
    };
    // =====================================================================================

    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);
    
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'cam'; // Iniciamos por defecto en CAM ya que el HDR está inactivo para optimizar
    let envInterval = null;
    let _scene = null, _renderer = null, _activeCamera = null;

    // Referencias a las luces físicas de Three.js nativo (v3.08: Solo Luces 2 y 3)
    let dynamicLight2 = null; // Luz 2: Clave / 1.er foco anclado
    let dynamicLight3 = null; // Luz 3: Relleno móvil / 2.º foco anclado

    // Colores objetivo con desaturación para protección cromática
    let targetLight2Color = null;
    let targetLight3Color = null;
    let neutralWhite = null;

    // Estado del sistema de memoria y anclaje espacial de luces (v3.08)
    let isLight2Anchored = false;
    let isLight3Anchored = false;

    let anchoredLight2Dir = null;
    let anchoredLight3Dir = null;

    // Estado de la transición cinemática de la Luz 3 (con atenuación intermedia)
    const light3Transition = {
      active: false,
      startTime: 0,
      duration: LIGHTING_CONFIG.transition_duration_ms,
      startPos: null,
      targetPos: null
    };

    document.getElementById('envToggle').addEventListener('click', (e) => {
      toggleEnv();
    });

    // Control de persistencia y lógica del botón Debug
    const isDebugActive = sessionStorage.getItem("debug_features") === "true";
    const debugToggleBtn = document.getElementById('debugToggle');
    if (debugToggleBtn) {
      debugToggleBtn.innerText = isDebugActive ? "Debug: ON" : "Debug: OFF";
      debugToggleBtn.style.borderColor = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.style.color = isDebugActive ? "#0f0" : "white";
      
      debugToggleBtn.addEventListener('click', () => {
        sessionStorage.setItem("debug_features", isDebugActive ? "false" : "true");
        window.location.reload();
      });
    }

    // === Acoplamiento sobre el THREE Nativo del motor ===
    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              _activeCamera = world.three.activeCamera;
              
              // Buscamos el THREE nativo expuesto globalmente por el runtime de 8th Wall
              const nativeTHREE = window.THREE;
              
              if (nativeTHREE) {
                // Activación de sombras dinámicas nativas
                _renderer.shadowMap.enabled = true;

                // === ACTIVACIÓN SEGURA DEL TONE MAPPING ===
                _renderer.toneMapping = nativeTHREE.ACESFilmicToneMapping;

                // Inicializamos colores objetivo y blanco neutro
                targetLight2Color = new nativeTHREE.Color(0xffffff);
                targetLight3Color = new nativeTHREE.Color(0xffffff);
                neutralWhite = new nativeTHREE.Color(0xffffff);

                anchoredLight2Dir = new nativeTHREE.Vector3(0, 1, 0);
                anchoredLight3Dir = new nativeTHREE.Vector3(0, 0, 0);

                light3Transition.startPos = new nativeTHREE.Vector3();
                light3Transition.targetPos = new nativeTHREE.Vector3();

                // === FORZAR RESOLUCIÓN Y FRUSTUM DE SOMBRA BASE (Luz 1 en Ground) ===
                _scene.traverse((node) => {
                  if (node.isDirectionalLight) {
                    if (node.shadow) {
                      node.shadow.mapSize.width = 256; // <-- Modificar a mano aquí para pruebas (p.ej. 512, 256) -- Antes 128
                      node.shadow.mapSize.height = 256; // <-- Modificar a mano aquí para pruebas (p.ej. 512, 256) -- Antes 128
                      if (node.shadow.camera) {
                        node.shadow.camera.left = -0.30; // Antes -0.35
                        node.shadow.camera.right = 0.30; // Antes 0.35
                        node.shadow.camera.top = 0.30; // Antes 0.35
                        node.shadow.camera.bottom = -0.30; // Antes -0.35
                        node.shadow.camera.near = 0.1; // Antes 0.1
                        node.shadow.camera.far = 10; // Rango amplio de sombra base
                        node.shadow.camera.updateProjectionMatrix();
                      }
                      if (node.shadow.map) {
                        node.shadow.map.dispose();
                        node.shadow.map = null;
                      }
                    }
                  }
                });

                // === CREACIÓN NATIVA DIRECTA EN THREE.JS (v3.08: Solo Luces 2 y 3) ===
                // 1. Instanciamos Luz 2 (Clave / 1.er foco anclado)
                dynamicLight2 = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                dynamicLight2.position.set(0, 1.8, 0);
                dynamicLight2.castShadow = LIGHTING_CONFIG.light2_castShadow;
                if (!LIGHTING_CONFIG.light2_castShadow && dynamicLight2.shadow && dynamicLight2.shadow.map) {
                  dynamicLight2.shadow.map.dispose();
                  dynamicLight2.shadow.map = null;
                }
                _scene.add(dynamicLight2);
                _scene.add(dynamicLight2.target);

                // 2. Instanciamos Luz 3 (Relleno lateral móvil rasante a la derecha por defecto)
                dynamicLight3 = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                dynamicLight3.position.set(
                  LIGHTING_CONFIG.light3_default_pos[0],
                  LIGHTING_CONFIG.light3_default_pos[1],
                  LIGHTING_CONFIG.light3_default_pos[2]
                );
                dynamicLight3.castShadow = LIGHTING_CONFIG.light3_castShadow;
                _scene.add(dynamicLight3);
                _scene.add(dynamicLight3.target);

                // Descargamos y registramos RGBELoader directamente en el THREE nativo
                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  } else {
                    log('Error: No se pudo instanciar el cargador.');
                  }
                });
              } else {
                log('Error: window.THREE nativo no encontrado.');
              }

            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    // Descarga dinámica de RGBELoader sobre la instancia nativa del motor
    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            // Evaluamos el código del loader forzando el ámbito del THREE nativo de 8th Wall
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => {
            log('Error al descargar RGBELoader: ' + err.message);
            resolve(null);
          });
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        // Inicializamos PMREM usando la clase nativa del motor de 8th Wall
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        // === CONTROL DE CARGA DEL HDR (Configuración manual) ===
        const LOAD_HDR = true; // Cambiar a true para reactivar la descarga y uso del entorno HDR
        
        if (LOAD_HDR) {
          new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
            hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            originalEnv = hdr;
            if (envMode === 'hdr') scene.environment = hdr;
          }, undefined, (err) => {
            log('Error cargando HDR: ' + err.message);
          });
        } else {
          log('HDR desactivado (LOAD_HDR = false)');
        }

        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);

            /* =====================================================================================
               SISTEMA LIGHT ESTIMATION ANTERIOR (v2.94) - COMENTADO PARA RECUPERACIÓN FUTURA
               -------------------------------------------------------------------------------------
               const lightEstimationSize = 4;
               const lightEstimationInterval = 1000;
               const lightCanvas = document.createElement('canvas');
               lightCanvas.width = lightEstimationSize;
               lightCanvas.height = lightEstimationSize;
               const lightCtx = lightCanvas.getContext('2d');

               envInterval = setInterval(() => {
                 try {
                   if (!video || video.readyState < 2) return;
                   lightCtx.drawImage(video, 0, 0, lightEstimationSize, lightEstimationSize);
                   const pixels = lightCtx.getImageData(0, 0, lightEstimationSize, lightEstimationSize).data;
                   let total = 0;
                   for (let i = 0; i < pixels.length; i += 4) {
                     total += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                   }
                   const brightness = total / (pixels.length / 4);
                   smoothed += (brightness - smoothed) * 0.08;

                   // LUZ PMREM LIGHT Ajuste de exposición basado en brillo promedio. Valores anteriores 0.4 y 1.5 respectively.
                   renderer.toneMappingExposure = 0.6 + (smoothed / 255) * 1.9; 
                 } catch (e) {
                   // Silencioso
                 }
               }, lightEstimationInterval);
            ===================================================================================== */

            // === CONFIGURACIÓN DEL PMREM Y CONTROL DINÁMICO 3D (v3.08) ===
            const pmremSize = LIGHTING_CONFIG.pmrem_resolution;
            const pmremInterval = LIGHTING_CONFIG.pmrem_interval_ms;
            const pmremCanvas = document.createElement('canvas');
            pmremCanvas.width = pmremSize;
            pmremCanvas.height = pmremSize;
            const pmremCtx = pmremCanvas.getContext('2d', { willReadFrequently: true });
            const envTexture = new THREE_INSTANCE.CanvasTexture(pmremCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;

            let smoothedBrightness = 0; // Inicia en 0 (cero estricto en oscuridad total)
            let targetLightX = pmremSize * 0.5;
            let targetLightY = pmremSize * 0.3;
            
            let lastScanTime = 0;
            const scanInterval = LIGHTING_CONFIG.scan_interval_ms;

            // Objetivos de intensidad en tiempo real (interpolados suavemente a 60 FPS)
            let targetIntensity2 = 0.0;
            let targetIntensity3 = 0.0;
            let targetExposure = 0.0;

            const targetLight3DPos2 = new THREE_INSTANCE.Vector3(0, 1.8, 0);

            // Vectores auxiliares para desproyección espacial 3D y restricciones
            const probeNDC = new THREE_INSTANCE.Vector3();
            const camWorldPos = new THREE_INSTANCE.Vector3();
            const rayDir = new THREE_INSTANCE.Vector3();
            const candidatePos = new THREE_INSTANCE.Vector3();

            // Colores temporales con protección de saturación cromática
            const rawColorBlob = new THREE_INSTANCE.Color();
            const rawColorAmbient = new THREE_INSTANCE.Color();

            // Función auxiliar para aplicar restricciones de mesa (altura mínima 25 cm y radio máx 2.0 m)
            const aplicarRestriccionesMesa = (outVec, origin, dir, dist) => {
              outVec.copy(origin).addScaledVector(dir, dist);
              if (outVec.length() > LIGHTING_CONFIG.max_light_radius) {
                outVec.setLength(LIGHTING_CONFIG.max_light_radius);
              }
              outVec.y = Math.max(LIGHTING_CONFIG.min_light_height, outVec.y);
            };

            setInterval(() => {
              try {
                if (!video || video.readyState < 2 || !pmremGenerator) return;

                const now = performance.now();

                // 1. DIBUJAMOS EL VÍDEO REAL LIMPIO EN EL CANVAS (v3.08: Sin probe artificial añadido)
                pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);

                // 2. ESCANEO DEL 100% DE LA PANTALLA (v3.08)
                if (now - lastScanTime > scanInterval) {
                  lastScanTime = now;
                  
                  const scanHeight = Math.floor(pmremSize * LIGHTING_CONFIG.scan_height_ratio);
                  const imgData = pmremCtx.getImageData(0, 0, pmremSize, scanHeight);
                  const data = imgData.data;

                  let sumR = 0, sumG = 0, sumB = 0;
                  let maxLum = 0;
                  let count = 0;

                  // Muestreo a pantalla completa con paso de 4 píxeles
                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    sumR += r;
                    sumG += g;
                    sumB += b;
                    count++;

                    if (lum > maxLum) {
                      maxLum = lum;
                    }
                  }

                  const avgR = count > 0 ? sumR / count : 0;
                  const avgG = count > 0 ? sumG / count : 0;
                  const avgB = count > 0 ? sumB / count : 0;
                  const avgLum = (avgR * 0.299 + avgG * 0.587 + avgB * 0.114);

                  // Detección de centro de masas del foco principal
                  const lumThreshold = Math.max(60, maxLum * 0.75);
                  let weightedSumX = 0;
                  let weightedSumY = 0;
                  let blobWeight = 0;
                  let blobR = 0, blobG = 0, blobB = 0;

                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    if (lum >= lumThreshold) {
                      const pixelIdx = idx / 4;
                      const px = pixelIdx % pmremSize;
                      const py = Math.floor(pixelIdx / pmremSize);
                      const weight = lum - lumThreshold + 1;

                      weightedSumX += px * weight;
                      weightedSumY += py * weight;
                      blobR += r * weight;
                      blobG += g * weight;
                      blobB += b * weight;
                      blobWeight += weight;
                    }
                  }

                  if (blobWeight > 0) {
                    targetLightX = weightedSumX / blobWeight;
                    targetLightY = Math.max(2, Math.min(scanHeight, weightedSumY / blobWeight));

                    // Tono cromático con margen de seguridad (evita teñir la comida en exceso)
                    if (targetLight2Color && neutralWhite) {
                      rawColorBlob.setRGB((blobR / blobWeight) / 255, (blobG / blobWeight) / 255, (blobB / blobWeight) / 255);
                      targetLight2Color.copy(neutralWhite).lerp(rawColorBlob, LIGHTING_CONFIG.chroma_tint_strength);
                    }
                  } else {
                    targetLightX = pmremSize * 0.5;
                    targetLightY = scanHeight * 0.3;
                    if (targetLight2Color) targetLight2Color.setRGB(1, 1, 1);
                  }

                  // Tono ambiental protegido
                  if (targetLight3Color && neutralWhite) {
                    rawColorAmbient.setRGB(avgR / 255, avgG / 255, avgB / 255);
                    targetLight3Color.copy(neutralWhite).lerp(rawColorAmbient, LIGHTING_CONFIG.chroma_tint_strength);
                  }

                  // Estimación de brillo lineal (0 a 1 estricto en oscuridad total)
                  smoothedBrightness += (avgLum - smoothedBrightness) * 0.15;
                  const normalizedBrightness = Math.max(0.0, Math.min(1.0, smoothedBrightness / 255));
                  const isObviousLight = maxLum >= LIGHTING_CONFIG.obvious_lum_threshold;

                  // --- DESPROYECCIÓN ESPACIAL 3D Y ANCLAJE SLAM (v3.08) ---
                  if (_activeCamera) {
                    const ndcX = (targetLightX / pmremSize) * 2 - 1;
                    const ndcY = 1 - (targetLightY / pmremSize) * 2;

                    _activeCamera.getWorldPosition(camWorldPos);
                    probeNDC.set(ndcX, ndcY, 0.5);
                    probeNDC.unproject(_activeCamera);
                    rayDir.subVectors(probeNDC, camWorldPos).normalize();

                    // 1. POSICIONAMIENTO Y ANCLAJE DE LUZ 2 (Primer foco)
                    if (!isLight2Anchored) {
                      aplicarRestriccionesMesa(targetLight3DPos2, camWorldPos, rayDir, LIGHTING_CONFIG.light2_distance);
                      if (dynamicLight2) dynamicLight2.position.copy(targetLight3DPos2);

                      if (isObviousLight) {
                        isLight2Anchored = true;
                        anchoredLight2Dir.copy(rayDir);
                      }
                    } else if (isObviousLight) {
                      // Comprobación de separación angular con Luz 2 para reubicar Luz 3 (Segundo foco)
                      const angleWith2 = rayDir.angleTo(anchoredLight2Dir);

                      if (angleWith2 >= LIGHTING_CONFIG.min_separation_angle) {
                        if (!isLight3Anchored && !light3Transition.active) {
                          aplicarRestriccionesMesa(candidatePos, camWorldPos, rayDir, LIGHTING_CONFIG.light2_distance);

                          // Iniciamos la transición suave de reubicación con atenuación previa (1.000 ms)
                          light3Transition.active = true;
                          light3Transition.startTime = now;
                          if (dynamicLight3) light3Transition.startPos.copy(dynamicLight3.position);
                          light3Transition.targetPos.copy(candidatePos);
                          
                          isLight3Anchored = true;
                          anchoredLight3Dir.copy(rayDir);
                        }
                      }
                    }
                  }

                  // --- CÁLCULO DE INTENSIDADES Y SOBREIMPULSO (> 235) ---
                  let boostFactor = 1.0;
                  if (maxLum > LIGHTING_CONFIG.boost_lum_threshold) {
                    const boostRatio = (maxLum - LIGHTING_CONFIG.boost_lum_threshold) / (255 - LIGHTING_CONFIG.boost_lum_threshold);
                    boostFactor = 1.0 + boostRatio * (LIGHTING_CONFIG.boost_multiplier - 1.0);
                  }

                  // Intensidades directas desacopladas e independientes
                  targetIntensity2 = normalizedBrightness * LIGHTING_CONFIG.light2_maxIntensity * boostFactor;
                  targetIntensity3 = normalizedBrightness * LIGHTING_CONFIG.light3_baseIntensity * boostFactor;

                  // Exposición ambiental PMREM limpia y lineal (0 estricto en oscuridad)
                  targetExposure = normalizedBrightness * LIGHTING_CONFIG.exposure_mult;
                }

                // 3. INTERPOLACIÓN CINEMÁTICA Y APLICACIÓN A 60 FPS (Anti-flickering)
                if (dynamicLight2) {
                  dynamicLight2.intensity += (targetIntensity2 - dynamicLight2.intensity) * 0.10;
                  if (targetLight2Color) dynamicLight2.color.lerp(targetLight2Color, 0.05);
                  dynamicLight2.target.position.set(0, 0, 0);
                }

                if (dynamicLight3) {
                  if (targetLight3Color) dynamicLight3.color.lerp(targetLight3Color, 0.05);
                  dynamicLight3.target.position.set(0, 0, 0);

                  // Manejo de la transición suave de 1.000 ms con atenuación (dip) para reubicar Luz 3
                  if (light3Transition.active) {
                    const elapsed = now - light3Transition.startTime;
                    const progress = Math.min(1.0, elapsed / light3Transition.duration);

                    // Curva de intensidad: cae al 15% (imperceptible en movimiento) y vuelve a subir en destino
                    const minDip = targetIntensity3 * 0.15;
                    const currentTransIntensity = progress < 0.5 
                      ? targetIntensity3 - (targetIntensity3 - minDip) * (progress * 2)
                      : minDip + (targetIntensity3 - minDip) * ((progress - 0.5) * 2);

                    dynamicLight3.intensity = currentTransIntensity;
                    dynamicLight3.position.lerpVectors(light3Transition.startPos, light3Transition.targetPos, progress);

                    if (progress >= 1.0) {
                      light3Transition.active = false;
                    }
                  } else {
                    dynamicLight3.intensity += (targetIntensity3 - dynamicLight3.intensity) * 0.10;
                  }
                }

                // Exposición suave en tiempo real
                renderer.toneMappingExposure += (targetExposure - renderer.toneMappingExposure) * 0.10;

                // 4. ACTUALIZACIÓN DE TEXTURA Y GENERACIÓN PMREM (Reflejos de la cámara real)
                envTexture.needsUpdate = true;
                const oldRT = cameraRT;
                cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                if (envMode === 'cam') scene.environment = cameraRT.texture;
                if (oldRT) oldRT.dispose();

              } catch (e) {
                // Silencioso
              }
            }, pmremInterval);
          }
        }, 500);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    // Interceptor de la inicialización de ECS (Mantiene la estructura original estable)
    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];

          // Calibración de Luz 1 (Ground / AO) desde la consola unificada
          if (obj.name === 'Directional Light') {
            if (obj.light) {
              obj.light.intensity = LIGHTING_CONFIG.light1_intensity;
            }
          }

          if (obj.name === 'Model') {
            obj.scale = [1.01, 1.01, 1.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) {
        log('Error: _scene sigue siendo null');
        return;
      }
      
      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) {
          _scene.environment = originalEnv;
          envMode = 'hdr';
          if (btn) btn.innerText = 'Env: HDR';
        } else {
          if (cameraRT) {
            _scene.environment = cameraRT.texture;
            envMode = 'cam';
            if (btn) btn.innerText = 'Env: CAM';
          } else {
            _scene.environment = null;
            envMode = 'off';
            if (btn) btn.innerText = 'Env: OFF';
          }
        }
      }
    };
  </script>

  <script src="bundle-world.js"></script>
