<!-- 9th Wall v3.43 Apple Probe -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v3.43<br>
      bundle: v3.10y<br>
      <span id="lightsCountSpan" style="color:#0f0;">Luces: 1</span><br>
      <span id="latencySpan" style="color:#0f0;">Latencia: -- ms</span>
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Env: CAM
  </button>

  <button id="debugToggle"
    style="position:fixed;bottom:20px;left:130px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Debug: OFF
  </button>

  <script>
    // =====================================================================================
    // === CONTROL DE ILUMINACIÓN (Consola Central de Calibración v3.43) ===
    // =====================================================================================
    const LIGHTING_CONFIG = {
      // --- INTENSIDADES BASE ---
      light1_intensity: 0.00,        // Luz 1 (ECS Ground / Cenital): 0.00 (apagada)
      light_maxIntensity: 2.85,      // Techo base para luces directas
      light2_initialRatio: 1.200,    // Luz 2 (+20% de potencia inicial: 0.72 -> 0.864, ~2.46 peak)
      light3_ratio: 1.00,            // Luz 3 (1.00 de potencia directa)
      light4_ratio: 0.90,            // Luz 4 (0.90 de potencia directa)
      
      // --- SOBREIMPULSO POR FUENTES DIRECTAS POTENTES (> 235) ---
      boost_lum_threshold: 235,      // Umbral de luminancia para sobreimpulso
      boost_multiplier: 1.25,        // Multiplicador contenido
      
      // --- SOMBRAS DINÁMICAS (SOLO LUZ 1 ECS AO) ---
      shadow_map_size: 512,          // Resolución de ShadowMap a 512x512
      shadow_radius_fixed: 8,        // Radio difuso suave para sombra de contacto (sin banding)
      ground_opacity_fixed: 0.35,    // Opacidad fija equilibrada del suelo (0.35)
      
      // --- RESTRICCIONES ESPACIALES Y TIEMPOS (CARRUSEL v3.18) ---
      light_distance: 1.2,           // Distancia de proyección espacial
      min_light_height: 0.20,        // Altura mínima obligatoria (20 cm sobre el plano SLAM)
      max_light_radius: 1.2,         // Radio espacial máximo respecto al centro
      elevation_angle_light2: (40.0 * Math.PI) / 180.0, // Elevación a 40º para Luz 2
      light3_default_pos: [1.3, 0.25, 0.0],  // Posición de espera Luz 3
      light4_default_pos: [-1.3, 0.25, 0.0], // Posición de espera Luz 4
      min_separation_angle: 0.52,    // Separación angular mínima (~30º) entre focos fijos
      wake_duration_ms: 800,         // Encendido reactivo al detectar foco (800 ms)
      decay_duration_ms: 4000,       // Caída suave y amortiguada fuera de cuadro (4000 ms)
      fade_out_duration_ms: 2500,    // Apagado progresivo de Luz 2 al activarse Luz 4 (2500 ms)
      out_of_frame_retention: 0.80,  // Retención física al girar la cámara
      
      // --- DETECCIÓN INTELIGENTE RELAJADA (-15%) Y HALO POR BORDES ---
      emitter_lum_threshold: 197,    // Luminancia de núcleo saturado (-15%: 232 -> 197)
      min_core_pixels: 2,            // Mínimo de 2 píxeles contiguos de núcleo
      contrast_delta_threshold: 72,  // Diferencia mínima foco vs fondo (-15%: 85 -> 72)
      temporal_drop_threshold: 12.7, // Caída por reacción ISO (-15%: 15 -> 12.7)
      halo_radius_px: 8,             // Radio de muestreo de halo hacia el exterior
      halo_drop_threshold: 34,       // Caída radial necesaria (-15%: 40 -> 34)
      upper_half_limit: 0.45,        // Búsqueda de emisores acotada al 45% superior
      debounce_cycles: 1,            // Ciclos para confirmación inmediata
      
      // --- CALIBRACIÓN LOOK SCENE VIEWER ---
      min_material_roughness: 0.35,     // Suelo de rugosidad
      metalness_bypass_threshold: 0.50, // Bypass: metales puros (> 0.5)
      emissive_pedestal: 0.042,         // Pedestal emisivo para levantar negros
      albedo_desaturation: 0.15,        // Desaturación albedo
      
      // --- AMBIENTE, TONE MAPPING Y AMORTIGUACIÓN CONTINUA DT ---
      exposure_base: 0.00,           // Exposición base cero
      exposure_mult: 1.804,          // Multiplicador ambiental PMREM (+10%: 1.64 -> 1.804)
      master_exposure_scale: 0.45,   // Exposición total maestra calibrada
      temporal_blend_alpha: 0.25,    // Fusión temporal en canvas PMREM (25% nuevo / 75% previo)
      smoothing_rate: 2.2,           // Tasa lambda para amortiguación continua dt
      p90_weight: 0.70,              // Peso del Percentil P90
      avg_weight: 0.30,              // Peso del promedio global
      
      // --- RENDIMIENTO PMREM 64x64 A 200 MS / ISO A 300 MS ---
      pmrem_resolution: 64,          // PMREM a 64x64
      pmrem_interval_ms: 200,        // Actualización PMREM GPU rápida cada 200 ms
      scan_interval_ms: 300,         // Escaneo de ISO cada 300 ms
      scan_pixel_step: 8             // Muestreo en CPU
    };
    // =====================================================================================

    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);
    
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'cam';
    let _scene = null, _renderer = null, _activeCamera = null, _groundMesh = null, _baseLight1 = null;

    // Estructura para ranuras de luces direccionales
    const crearRanuraLuz = () => ({
      light: null,
      isAnchored: false,
      anchoredDir: null,
      anchoredIntensity: 0.0,
      targetIntensity: 0.0,
      lastAnchorTime: 0,
      state: 'idle', // 'idle' | 'active' | 'fading_in' | 'fading_out_final'
      transition: {
        startTime: 0,
        startIntensity: 0.0,
        destIntensity: 0.0,
        destPos: null,
        destDir: null
      }
    });

    const slotLight2 = crearRanuraLuz();
    const slotLight3 = crearRanuraLuz();
    const slotLight4 = crearRanuraLuz();
    const carruselSlots = [slotLight2, slotLight3, slotLight4];

    let previousAvgLum = 128;
    let light2InitialPlaced = false;
    let lastFrameTime = performance.now();
    let totalLightsDetected = 1;
    let totalRealLightsAnchored = 0;
    let detectionPermanentlyStopped = false;

    // Persistencia temporal (Debounce)
    const candidateDebounce = {
      active: false,
      screenX: 0,
      screenY: 0,
      consecutiveCycles: 0,
      dir: null
    };

    const actualizarContadorLuces = () => {
      const lightsSpan = document.getElementById('lightsCountSpan');
      if (lightsSpan) {
        lightsSpan.innerText = `Luces: ${totalLightsDetected}`;
      }
    };

    document.getElementById('envToggle').addEventListener('click', (e) => {
      toggleEnv();
    });

    const isDebugActive = sessionStorage.getItem("debug_features") === "true";
    const debugToggleBtn = document.getElementById('debugToggle');
    if (debugToggleBtn) {
      debugToggleBtn.innerText = isDebugActive ? "Debug: ON" : "Debug: OFF";
      debugToggleBtn.style.borderColor = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.style.color = isDebugActive ? "#0f0" : "white";
      
      debugToggleBtn.addEventListener('click', () => {
        sessionStorage.setItem("debug_features", isDebugActive ? "false" : "true");
        window.location.reload();
      });
    }

    // === Acoplamiento sobre el THREE Nativo del motor ===
    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              _activeCamera = world.three.activeCamera;
              
              const nativeTHREE = window.THREE;
              
              if (nativeTHREE) {
                _renderer.shadowMap.enabled = true;
                _renderer.toneMapping = nativeTHREE.ACESFilmicToneMapping;

                candidateDebounce.dir = new nativeTHREE.Vector3();

                carruselSlots.forEach(slot => {
                  slot.anchoredDir = new nativeTHREE.Vector3(0, 1, 0);
                  slot.transition.destPos = new nativeTHREE.Vector3();
                  slot.transition.destDir = new nativeTHREE.Vector3();
                });

                // Captura del Ground y Luz 1 (Sombra cenital AO en mapa 512x512)
                _scene.traverse((node) => {
                  if (node.isMesh && node.material && (node.material.type === 'ShadowMaterial' || node.name === 'Ground')) {
                    _groundMesh = node;
                    if (_groundMesh.material) {
                      _groundMesh.material.opacity = LIGHTING_CONFIG.ground_opacity_fixed;
                    }
                  }
                  if (node.isDirectionalLight) {
                    _baseLight1 = node;
                    node.intensity = LIGHTING_CONFIG.light1_intensity;
                    if (node.shadow) {
                      node.shadow.mapSize.width = LIGHTING_CONFIG.shadow_map_size;
                      node.shadow.mapSize.height = LIGHTING_CONFIG.shadow_map_size;
                      node.shadow.radius = LIGHTING_CONFIG.shadow_radius_fixed;
                      if (node.shadow.camera) {
                        node.shadow.camera.left = -0.50;
                        node.shadow.camera.right = 0.50;
                        node.shadow.camera.top = 0.50;
                        node.shadow.camera.bottom = -0.50;
                        node.shadow.camera.near = 0.1;
                        node.shadow.camera.far = 10;
                        node.shadow.camera.updateProjectionMatrix();
                      }
                      if (node.shadow.map) {
                        node.shadow.map.dispose();
                        node.shadow.map = null;
                      }
                    }
                  }
                });

                // 1. Instanciamos Luz 2 (Sin sombras Three.js)
                slotLight2.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight2.light.position.set(0, 1.41, -1.69);
                _scene.add(slotLight2.light);
                _scene.add(slotLight2.light.target);

                // 2. Instanciamos Luz 3 (Sin sombras Three.js)
                slotLight3.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight3.light.position.set(
                  LIGHTING_CONFIG.light3_default_pos[0],
                  LIGHTING_CONFIG.light3_default_pos[1],
                  LIGHTING_CONFIG.light3_default_pos[2]
                );
                _scene.add(slotLight3.light);
                _scene.add(slotLight3.light.target);

                // 3. Instanciamos Luz 4 (Sin sombras Three.js)
                slotLight4.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight4.light.position.set(
                  LIGHTING_CONFIG.light4_default_pos[0],
                  LIGHTING_CONFIG.light4_default_pos[1],
                  LIGHTING_CONFIG.light4_default_pos[2]
                );
                _scene.add(slotLight4.light);
                _scene.add(slotLight4.light.target);

                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  } else {
                    log('Error: No se pudo instanciar el cargador.');
                  }
                });
              } else {
                log('Error: window.THREE nativo no encontrado.');
              }

            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => {
            log('Error al descargar RGBELoader: ' + err.message);
            resolve(null);
          });
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        const LOAD_HDR = true;
        
        if (LOAD_HDR) {
          new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
            hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            originalEnv = hdr;
            if (envMode === 'hdr') scene.environment = hdr;
          }, undefined, (err) => {
            log('Error cargando HDR: ' + err.message);
          });
        }

        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);

            // === CONFIGURACIÓN DEL PMREM A 64x64 ===
            const pmremSize = LIGHTING_CONFIG.pmrem_resolution;
            const pmremCanvas = document.createElement('canvas');
            pmremCanvas.width = pmremSize;
            pmremCanvas.height = pmremSize;
            const pmremCtx = pmremCanvas.getContext('2d', { willReadFrequently: true });
            
            // Inicialización limpia al 100% de opacidad
            pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);

            const envTexture = new THREE_INSTANCE.CanvasTexture(pmremCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            if (THREE_INSTANCE.sRGBEncoding) {
              envTexture.encoding = THREE_INSTANCE.sRGBEncoding;
            }

            let smoothedBrightness = 0;
            let targetExposure = 0.0;
            let lastScanTime = 0;
            let lastPmremTime = 0;

            const probeNDC = new THREE_INSTANCE.Vector3();
            const camWorldPos = new THREE_INSTANCE.Vector3();
            const rayDir = new THREE_INSTANCE.Vector3();
            const candidatePos = new THREE_INSTANCE.Vector3();

            const aplicarRestriccionesMesa = (outVec, origin, dir, dist) => {
              outVec.copy(origin).addScaledVector(dir, dist);
              if (outVec.length() > LIGHTING_CONFIG.max_light_radius) {
                outVec.setLength(LIGHTING_CONFIG.max_light_radius);
              }
              outVec.y = Math.max(LIGHTING_CONFIG.min_light_height, outVec.y);
            };

            const iniciarFadeInSlot = (slot, destPos, destIntensity, newDir, now) => {
              slot.state = 'fading_in';
              slot.isAnchored = true;
              slot.lastAnchorTime = now;
              slot.transition.startTime = now;
              slot.transition.startIntensity = slot.light ? slot.light.intensity : 0.0;
              slot.transition.destIntensity = destIntensity;
              slot.transition.destPos.copy(destPos);
              slot.transition.destDir.copy(newDir);
              slot.anchoredDir.copy(newDir);
              slot.anchoredIntensity = destIntensity;
              if (slot.light) slot.light.position.copy(destPos);
            };

            const iniciarFadeOutFinalLuz2 = (now) => {
              slotLight2.state = 'fading_out_final';
              slotLight2.transition.startTime = now;
              slotLight2.transition.startIntensity = slotLight2.light ? slotLight2.light.intensity : 0.0;
              slotLight2.transition.destIntensity = 0.0;
            };

            const aplicarAjustesSceneViewer = () => {
              if (!_scene) return;
              _scene.traverse((child) => {
                if (child.isMesh && child.material) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  mats.forEach((mat) => {
                    const isPBR = (mat.type === 'MeshStandardMaterial' || mat.type === 'MeshPhysicalMaterial');
                    if (!isPBR) return;

                    const isMetal = mat.metalness !== undefined && mat.metalness > LIGHTING_CONFIG.metalness_bypass_threshold;
                    if (!isMetal && mat.roughness !== undefined && mat.roughness < LIGHTING_CONFIG.min_material_roughness) {
                      mat.roughness = LIGHTING_CONFIG.min_material_roughness;
                    }

                    if (mat.emissive !== undefined) {
                      const p = LIGHTING_CONFIG.emissive_pedestal;
                      if (mat.emissive.r < p && mat.emissive.g < p && mat.emissive.b < p) {
                        mat.emissive.setRGB(p, p, p);
                      }
                    }

                    if (mat.color && !mat._desaturated) {
                      const hsl = { h: 0, s: 0, l: 0 };
                      mat.color.getHSL(hsl);
                      hsl.s = Math.max(0.0, hsl.s * (1.0 - LIGHTING_CONFIG.albedo_desaturation));
                      mat.color.setHSL(hsl.h, hsl.s, hsl.l);
                      mat._desaturated = true;
                    }
                  });
                }
              });
            };

            const lumaBins = new Int32Array(16);

            // BUCLE MAESTRO TEMPORIZADO (ISO a 300 ms / PMREM GPU a 200 ms)
            setInterval(() => {
              try {
                if (!video || video.readyState < 2 || !pmremGenerator) return;

                const now = performance.now();
                const deltaSec = Math.max(0.001, (now - lastFrameTime) / 1000.0);
                lastFrameTime = now;

                // =========================================================================
                // 1. ESCANEO ISO Y DETECCIÓN INTELIGENTE (Cada 300 ms)
                // =========================================================================
                if (now - lastScanTime >= LIGHTING_CONFIG.scan_interval_ms) {
                  lastScanTime = now;

                  const imgData = pmremCtx.getImageData(0, 0, pmremSize, pmremSize);
                  const data = imgData.data;

                  const scanEmitterHeight = Math.floor(pmremSize * LIGHTING_CONFIG.upper_half_limit);
                  let sumR = 0, sumG = 0, sumB = 0;
                  let maxLum = 0;
                  let maxLumX = pmremSize * 0.5, maxLumY = pmremSize * 0.3;
                  let count = 0;
                  let corePixelCount = 0;
                  let coreSumX = 0, coreSumY = 0;

                  let minCoreX = pmremSize, maxCoreX = 0;
                  let minCoreY = scanEmitterHeight, maxCoreY = 0;

                  const colorBins = new Int32Array(8);
                  const colorBinLumSumX = new Float32Array(8);
                  const colorBinLumSumY = new Float32Array(8);
                  const colorBinWeight = new Float32Array(8);

                  lumaBins.fill(0);

                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    const pixelIdx = idx / 4;
                    const px = pixelIdx % pmremSize;
                    const py = Math.floor(pixelIdx / pmremSize);

                    sumR += r;
                    sumG += g;
                    sumB += b;
                    count++;

                    const binIdx = Math.min(15, Math.floor((lum / 256) * 16));
                    lumaBins[binIdx]++;

                    if (lum > maxLum) {
                      maxLum = lum;
                      maxLumX = px;
                      maxLumY = py;
                    }

                    if (py < scanEmitterHeight && lum >= LIGHTING_CONFIG.emitter_lum_threshold) {
                      corePixelCount++;
                      coreSumX += px;
                      coreSumY += py;
                      if (px < minCoreX) minCoreX = px;
                      if (px > maxCoreX) maxCoreX = px;
                      if (py < minCoreY) minCoreY = py;
                      if (py > maxCoreY) maxCoreY = py;
                    }

                    if (!light2InitialPlaced) {
                      const cBin = ((r > 100 ? 1 : 0) << 2) | ((g > 100 ? 1 : 0) << 1) | (b > 100 ? 1 : 0);
                      colorBins[cBin]++;
                      colorBinLumSumX[cBin] += px * lum;
                      colorBinLumSumY[cBin] += py * lum;
                      colorBinWeight[cBin] += lum;
                    }
                  }

                  const avgR = count > 0 ? sumR / count : 0;
                  const avgG = count > 0 ? sumG / count : 0;
                  const avgB = count > 0 ? sumB / count : 0;
                  const avgLum = (avgR * 0.299 + avgG * 0.587 + avgB * 0.114);

                  let p90Lum = avgLum;
                  let accumulated = 0;
                  const p90Target = count * 0.90;
                  for (let b = 0; b < 16; b++) {
                    accumulated += lumaBins[b];
                    if (accumulated >= p90Target) {
                      p90Lum = ((b + 0.5) / 16) * 255;
                      break;
                    }
                  }

                  const effectiveIlluminance = (avgLum * LIGHTING_CONFIG.avg_weight) + (p90Lum * LIGHTING_CONFIG.p90_weight);
                  const temporalDrop = previousAvgLum - avgLum;
                  previousAvgLum = avgLum;

                  const candidateX = corePixelCount > 0 ? (coreSumX / corePixelCount) : maxLumX;
                  const candidateY = corePixelCount > 0 ? (coreSumY / corePixelCount) : maxLumY;

                  const getPixelLum = (px, py) => {
                    const cx = Math.max(0, Math.min(pmremSize - 1, Math.floor(px)));
                    const cy = Math.max(0, Math.min(pmremSize - 1, Math.floor(py)));
                    const pIdx = (cy * pmremSize + cx) * 4;
                    return data[pIdx] * 0.299 + data[pIdx + 1] * 0.587 + data[pIdx + 2] * 0.114;
                  };

                  const R = LIGHTING_CONFIG.halo_radius_px;
                  const coreLum = getPixelLum(candidateX, candidateY);
                  
                  const sampleRightX = corePixelCount > 0 ? (maxCoreX + R) : (candidateX + R);
                  const sampleLeftX  = corePixelCount > 0 ? (minCoreX - R) : (candidateX - R);
                  const sampleDownY  = corePixelCount > 0 ? (maxCoreY + R) : (candidateY + R);
                  const sampleUpY    = corePixelCount > 0 ? (minCoreY - R) : (candidateY - R);

                  let steepDrops = 0;
                  if ((coreLum - getPixelLum(sampleRightX, candidateY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;
                  if ((coreLum - getPixelLum(sampleLeftX, candidateY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;
                  if ((coreLum - getPixelLum(candidateX, sampleDownY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;
                  if ((coreLum - getPixelLum(candidateX, sampleUpY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;

                  const hasRadialHalo = (steepDrops >= 2);
                  const hasCompactCore = corePixelCount >= LIGHTING_CONFIG.min_core_pixels;
                  const contrastDelta = coreLum - avgLum;
                  const hasSufficientContrast = (contrastDelta >= LIGHTING_CONFIG.contrast_delta_threshold) || (temporalDrop >= LIGHTING_CONFIG.temporal_drop_threshold);

                  const isConfirmedRealLight = (candidateY < scanEmitterHeight) && hasCompactCore && hasRadialHalo && hasSufficientContrast;

                  smoothedBrightness = effectiveIlluminance;
                  const normalizedBrightness = Math.max(0.0, Math.min(1.0, smoothedBrightness / 255));

                  let boostFactor = 1.0;
                  if (maxLum > LIGHTING_CONFIG.boost_lum_threshold) {
                    const boostRatio = (maxLum - LIGHTING_CONFIG.boost_lum_threshold) / (255 - LIGHTING_CONFIG.boost_lum_threshold);
                    boostFactor = 1.0 + boostRatio * (LIGHTING_CONFIG.boost_multiplier - 1.0);
                  }

                  const baseDirectIntensity = normalizedBrightness * LIGHTING_CONFIG.light_maxIntensity * boostFactor;
                  slotLight2.targetIntensity = baseDirectIntensity * LIGHTING_CONFIG.light2_initialRatio;
                  slotLight3.targetIntensity = baseDirectIntensity * LIGHTING_CONFIG.light3_ratio;
                  slotLight4.targetIntensity = baseDirectIntensity * LIGHTING_CONFIG.light4_ratio;

                  // --- FRAME 1: POSICIONAMIENTO DE LUZ 2 (Gradiente de Mesa a 40º) ---
                  if (!light2InitialPlaced && _activeCamera) {
                    let targetX2 = pmremSize * 0.5;
                    let targetY2 = pmremSize * 0.4;
                    let dominantBin = 0, maxBinCount = 0;
                    for (let c = 0; c < 8; c++) {
                      if (colorBins[c] > maxBinCount) {
                        maxBinCount = colorBins[c];
                        dominantBin = c;
                      }
                    }
                    if (maxBinCount > (count * 0.20) && colorBinWeight[dominantBin] > 0) {
                      targetX2 = colorBinLumSumX[dominantBin] / colorBinWeight[dominantBin];
                      targetY2 = colorBinLumSumY[dominantBin] / colorBinWeight[dominantBin];
                    }

                    const ndcX = (targetX2 / pmremSize) * 2 - 1;
                    const ndcY = 1 - (targetY2 / pmremSize) * 2;

                    _activeCamera.getWorldPosition(camWorldPos);
                    probeNDC.set(ndcX, ndcY, 0.5);
                    probeNDC.unproject(_activeCamera);
                    rayDir.subVectors(probeNDC, camWorldPos).normalize();

                    const elevAngle = LIGHTING_CONFIG.elevation_angle_light2;
                    const r = LIGHTING_CONFIG.light_distance;
                    const initY = Math.max(LIGHTING_CONFIG.min_light_height, Math.sin(elevAngle) * r);
                    const initXZ = Math.cos(elevAngle) * r;
                    const azimLen = Math.hypot(rayDir.x, rayDir.z) || 1.0;

                    if (slotLight2.light) {
                      slotLight2.light.position.set((rayDir.x / azimLen) * initXZ, initY, (rayDir.z / azimLen) * initXZ);
                      slotLight2.anchoredDir.copy(slotLight2.light.position).normalize();
                      slotLight2.isAnchored = true;
                      slotLight2.state = 'active';
                      slotLight2.anchoredIntensity = slotLight2.targetIntensity;
                      slotLight2.lastAnchorTime = now;
                      light2InitialPlaced = true;
                      actualizarContadorLuces();
                    }
                  } else if (slotLight2.state === 'active' && totalRealLightsAnchored === 0) {
                    slotLight2.anchoredIntensity = slotLight2.targetIntensity;
                  }

                  // --- CARRUSEL DINÁMICO (MÁXIMO 2 LUCES SIMULTÁNEAS) ---
                  if (!detectionPermanentlyStopped && _activeCamera && isConfirmedRealLight) {
                    const ndcX = (candidateX / pmremSize) * 2 - 1;
                    const ndcY = 1 - (candidateY / pmremSize) * 2;

                    _activeCamera.getWorldPosition(camWorldPos);
                    probeNDC.set(ndcX, ndcY, 0.5);
                    probeNDC.unproject(_activeCamera);
                    rayDir.subVectors(probeNDC, camWorldPos).normalize();

                    aplicarRestriccionesMesa(candidatePos, camWorldPos, rayDir, LIGHTING_CONFIG.light_distance);

                    let isInsideExistingCone = false;
                    carruselSlots.forEach(slot => {
                      if (slot.isAnchored && slot.state !== 'fading_out_final') {
                        if (rayDir.angleTo(slot.anchoredDir) < LIGHTING_CONFIG.min_separation_angle) {
                          isInsideExistingCone = true;
                        }
                      }
                    });

                    if (!isInsideExistingCone) {
                      if (candidateDebounce.active && 
                          Math.abs(candidateDebounce.screenX - candidateX) < 16 && 
                          Math.abs(candidateDebounce.screenY - candidateY) < 16) {
                        candidateDebounce.consecutiveCycles++;
                      } else {
                        candidateDebounce.active = true;
                        candidateDebounce.screenX = candidateX;
                        candidateDebounce.screenY = candidateY;
                        candidateDebounce.consecutiveCycles = 1;
                        candidateDebounce.dir.copy(rayDir);
                      }

                      if (candidateDebounce.consecutiveCycles >= LIGHTING_CONFIG.debounce_cycles) {
                        candidateDebounce.active = false;
                        candidateDebounce.consecutiveCycles = 0;

                        if (!slotLight3.isAnchored && slotLight3.state === 'idle') {
                          iniciarFadeInSlot(slotLight3, candidatePos, baseDirectIntensity * LIGHTING_CONFIG.light3_ratio, rayDir, now);
                          totalRealLightsAnchored = 1;
                          totalLightsDetected = 2;
                          actualizarContadorLuces();
                        } 
                        else if (!slotLight4.isAnchored && slotLight4.state === 'idle') {
                          iniciarFadeInSlot(slotLight4, candidatePos, baseDirectIntensity * LIGHTING_CONFIG.light4_ratio, rayDir, now);
                          iniciarFadeOutFinalLuz2(now);
                          totalRealLightsAnchored = 2;
                          totalLightsDetected = 3;
                          actualizarContadorLuces();
                          detectionPermanentlyStopped = true;
                        }
                      }
                    } else {
                      candidateDebounce.active = false;
                      candidateDebounce.consecutiveCycles = 0;
                    }
                  }

                  targetExposure = normalizedBrightness * LIGHTING_CONFIG.exposure_mult * LIGHTING_CONFIG.master_exposure_scale;
                }

                // =========================================================================
                // 2. ACTUALIZACIÓN PMREM CON FUSIÓN TEMPORAL SUAVE (Cada 200 ms)
                // =========================================================================
                if (now - lastPmremTime >= LIGHTING_CONFIG.pmrem_interval_ms) {
                  lastPmremTime = now;

                  // Fusión temporal segura: mezcla con alpha y resetea inmediatamente a 1.0
                  pmremCtx.globalAlpha = LIGHTING_CONFIG.temporal_blend_alpha;
                  pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);
                  pmremCtx.globalAlpha = 1.0;

                  envTexture.needsUpdate = true;
                  const oldRT = cameraRT;
                  cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                  if (envMode === 'cam') scene.environment = cameraRT.texture;
                  if (oldRT) oldRT.dispose();
                }

                // =========================================================================
                // 3. CINEMÁTICA Y AMORTIGUACIÓN CONTINUA DT DE LUCES
                // =========================================================================
                if (_activeCamera) {
                  _activeCamera.getWorldDirection(rayDir);
                }

                carruselSlots.forEach(slot => {
                  if (!slot.light) return;
                  slot.light.target.position.set(0, 0, 0);

                  if (slot.state === 'fading_out_final') {
                    const elapsed = now - slot.transition.startTime;
                    const progress = Math.min(1.0, elapsed / LIGHTING_CONFIG.fade_out_duration_ms);
                    slot.light.intensity = THREE_INSTANCE.MathUtils.lerp(slot.transition.startIntensity, 0.0, progress);

                    if (progress >= 1.0) {
                      slot.state = 'idle';
                      slot.isAnchored = false;
                      slot.light.intensity = 0.0;
                    }
                  } else if (slot.state === 'fading_in') {
                    const elapsed = now - slot.transition.startTime;
                    const progress = Math.min(1.0, elapsed / LIGHTING_CONFIG.wake_duration_ms);
                    slot.light.intensity = THREE_INSTANCE.MathUtils.lerp(slot.transition.startIntensity, slot.transition.destIntensity, progress);

                    if (progress >= 1.0) {
                      slot.state = 'active';
                      slot.anchoredIntensity = slot.transition.destIntensity;
                    }
                  } else if (slot.state === 'active') {
                    const isFacing = _activeCamera ? (rayDir.angleTo(slot.anchoredDir) < LIGHTING_CONFIG.min_separation_angle) : true;
                    const effectiveTarget = isFacing 
                      ? slot.targetIntensity 
                      : (slot.anchoredIntensity * LIGHTING_CONFIG.out_of_frame_retention);

                    const isRising = effectiveTarget > slot.light.intensity;
                    const duration = isRising ? LIGHTING_CONFIG.wake_duration_ms : LIGHTING_CONFIG.decay_duration_ms;
                    const lightRate = 1000.0 / duration;
                    const lightLerpStep = 1.0 - Math.exp(-lightRate * deltaSec);
                    
                    slot.light.intensity += (effectiveTarget - slot.light.intensity) * lightLerpStep;
                  } else if (slot.state === 'idle') {
                    slot.light.intensity = 0.0;
                  }
                });

                const expLerpStep = 1.0 - Math.exp(-LIGHTING_CONFIG.smoothing_rate * deltaSec);
                renderer.toneMappingExposure += (targetExposure - renderer.toneMappingExposure) * expLerpStep;

                aplicarAjustesSceneViewer();

              } catch (e) {}
            }, 50);

          }
        }, 500);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];

          if (obj.name === 'Directional Light') {
            if (obj.light) {
              obj.light.intensity = LIGHTING_CONFIG.light1_intensity;
            }
          }

          if (obj.name === 'Model') {
            obj.scale = [1.01, 1.01, 1.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) {
        log('Error: _scene sigue siendo null');
        return;
      }
      
      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) {
          _scene.environment = originalEnv;
          envMode = 'hdr';
          if (btn) btn.innerText = 'Env: HDR';
        } else {
          if (cameraRT) {
            _scene.environment = cameraRT.texture;
            envMode = 'cam';
            if (btn) btn.innerText = 'Env: CAM';
          } else {
            _scene.environment = null;
            envMode = 'off';
            if (btn) btn.innerText = 'Env: OFF';
          }
        }
      }
    };
  </script>

  <script src="bundle-world.js"></script>
