<!-- 9th Wall v3.16 Apple Probe -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v3.16<br>
      bundle: v3.10y<br>
      <span id="lightsCountSpan" style="color:#0f0;">Luces: 1</span><br>
      <span id="latencySpan" style="color:#0f0;">Latencia: -- ms</span>
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Env: CAM
  </button>

  <button id="debugToggle"
    style="position:fixed;bottom:20px;left:130px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Debug: OFF
  </button>

  <script>
    // =====================================================================================
    // === CONTROL DE ILUMINACIÓN (Consola Central de Calibración v3.16) ===
    // =====================================================================================
    const LIGHTING_CONFIG = {
      // --- INTENSIDADES BASE Y PARIDAD DE FOCOS (v3.16) ---
      light1_intensity: 0.10,        // Luz 1 (ECS Ground / AO): 0.10 contacto cenital suave
      light_maxIntensity: 2.60,      // Techo máximo rotundo para luces directas (volumen y especular)
      light2_initialRatio: 0.65,     // Potencia inicial de Luz 2 a 45º (65% de 2.60 = ~1.69 para modelado inmediato)
      
      // --- SOBREIMPULSO POR FUENTES DIRECTAS POTENTES (> 235) ---
      boost_lum_threshold: 235,      // Umbral de luminancia para activar sobreimpulso (235-255)
      boost_multiplier: 1.25,        // Multiplicador contenido para lámparas reales
      
      // --- SOMBRAS DINÁMICAS SUAVES (v3.16) ---
      light1_castShadow: true,       // Sombra base de contacto en el suelo (Ground)
      shadow_radius_direct: 2.2,     // Radio de sombra suave con foco directo
      shadow_radius_ambient: 4.0,    // Radio de difusión para AO ambiental
      ground_opacity_direct: 0.38,   // Opacidad del suelo con sombra directa
      ground_opacity_ambient: 0.45,  // Opacidad del suelo en modo difuso (mantiene contacto sólido)
      light2_castShadow: false,      // Desactivadas para optimizar rendimiento móvil
      light3_castShadow: false,
      light4_castShadow: false,
      
      // --- RESTRICCIONES ESPACIALES Y CARRUSEL TÁNDEM (v3.16) ---
      light2_distance: 2.2,          // Distancia de proyección espacial
      min_light_height: 0.25,        // Altura mínima obligatoria sobre el plano de la mesa (25 cm)
      max_light_radius: 2.0,         // Radio espacial máximo respecto al centro [0,0,0] (2 metros)
      light3_default_pos: [1.3, 0.25, 0.0],  // Posición inicial de espera Luz 3
      light4_default_pos: [-1.3, 0.25, 0.0], // Posición inicial de espera Luz 4
      min_separation_angle: 0.52,    // Separación angular mínima (~30º) entre focos fijos
      wake_duration_ms: 800,         // Encendido rápido y reactivo al detectar foco (800 ms)
      decay_duration_ms: 4000,       // Caída suave y amortiguada al salir de cuadro (4000 ms)
      out_of_frame_retention: 0.60,  // Retención física del 60% en el mundo AR al girar la cámara
      
      // --- DETECCIÓN INTELIGENTE ANTI-FALSOS POSITIVOS (v3.16) ---
      emitter_clipping_threshold: 245,// Detección de emisor real (clipping del sensor en canales RGB)
      obvious_lum_threshold: 215,    // Umbral estricto para evitar confundir paredes o folios blancos
      contrast_delta_threshold: 115, // Diferencia foco vs fondo para confirmar luz real
      temporal_drop_threshold: 15,   // Caída de brillo que delata reacción ISO
      upper_half_limit: 0.45,        // Límite vertical: solo se buscan emisores en el 45% superior
      large_area_threshold: 0.06,    // Filtro de área grande (ventanas/paneles difusos)
      
      // --- SUELO DE RUGOSIDAD DINÁMICO (PROTECCIÓN ANTI-TITILEO EN DIELÉCTRICOS) ---
      min_material_roughness: 0.20,  // Suelo de rugosidad en 0.20 para evitar parpadeo estrellado en tomates/vajilla
      metalness_bypass_threshold: 0.50, // Bypass: metales puros (> 0.5) se mantienen como espejos nítidos
      
      // --- AMBIENTE, TONE MAPPING Y ESTRATEGIA SERVILLETA (P90) ---
      exposure_base: 0.00,           // Exposición en oscuridad total
      exposure_mult: 2.00,           // Multiplicador ambiental PMREM base
      reaction_speed: 0.35,          // Factor de respuesta fluida para PMREM y exposición
      p90_weight: 0.70,              // Peso del Percentil P90 (Solución Servilleta al 100% de la pantalla)
      avg_weight: 0.30,              // Peso del promedio global
      
      // --- LIGHT ESTIMATION: RESOLUCIÓN Y ESCANEO ---
      pmrem_resolution: 64,          // Tamaño del canvas PMREM (64x64 píxeles)
      pmrem_interval_ms: 200,        // Frecuencia de actualización PMREM (cada 200 ms)
      scan_interval_ms: 200,         // Frecuencia de escaneo (cada 200 ms)
      scan_pixel_step: 16            // Muestreo en bytes (cada 4 píxeles)
    };
    // =====================================================================================

    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);
    
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'cam';
    let envInterval = null;
    let _scene = null, _renderer = null, _activeCamera = null, _groundMesh = null, _baseLight1 = null;

    // Estructuras de control para el Carrusel Tándem LRU (v3.16)
    const crearRanuraLuz = () => ({
      light: null,
      isAnchored: false,
      anchoredDir: null,
      anchoredIntensity: 0.0,
      targetIntensity: 0.0,
      lastAnchorTime: 0,
      state: 'idle', // 'idle' | 'active' | 'fading_out' | 'fading_in'
      transition: {
        startTime: 0,
        startIntensity: 0.0,
        destIntensity: 0.0,
        destPos: null,
        destDir: null
      }
    });

    const slotLight2 = crearRanuraLuz();
    const slotLight3 = crearRanuraLuz();
    const slotLight4 = crearRanuraLuz();
    const carruselSlots = [slotLight2, slotLight3, slotLight4];

    let previousAvgLum = 128;
    let hasDetectedDirectLight = false;
    let light2InitialPlaced = false;
    let lastFrameTime = performance.now();
    let totalLightsDetected = 1; // Inicia en 1 por la Luz 2 inicial

    const actualizarContadorLuces = () => {
      const lightsSpan = document.getElementById('lightsCountSpan');
      if (lightsSpan) {
        lightsSpan.innerText = `Luces: ${totalLightsDetected}`;
      }
    };

    document.getElementById('envToggle').addEventListener('click', (e) => {
      toggleEnv();
    });

    const isDebugActive = sessionStorage.getItem("debug_features") === "true";
    const debugToggleBtn = document.getElementById('debugToggle');
    if (debugToggleBtn) {
      debugToggleBtn.innerText = isDebugActive ? "Debug: ON" : "Debug: OFF";
      debugToggleBtn.style.borderColor = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.style.color = isDebugActive ? "#0f0" : "white";
      
      debugToggleBtn.addEventListener('click', () => {
        sessionStorage.setItem("debug_features", isDebugActive ? "false" : "true");
        window.location.reload();
      });
    }

    // === Acoplamiento sobre el THREE Nativo del motor ===
    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              _activeCamera = world.three.activeCamera;
              
              const nativeTHREE = window.THREE;
              
              if (nativeTHREE) {
                _renderer.shadowMap.enabled = true;
                _renderer.toneMapping = nativeTHREE.ACESFilmicToneMapping;

                carruselSlots.forEach(slot => {
                  slot.anchoredDir = new nativeTHREE.Vector3(0, 1, 0);
                  slot.transition.destPos = new nativeTHREE.Vector3();
                  slot.transition.destDir = new nativeTHREE.Vector3();
                });

                // Captura del Ground y Luz 1
                _scene.traverse((node) => {
                  if (node.isMesh && node.material && (node.material.type === 'ShadowMaterial' || node.name === 'Ground')) {
                    _groundMesh = node;
                    if (_groundMesh.material) {
                      _groundMesh.material.opacity = LIGHTING_CONFIG.ground_opacity_ambient;
                    }
                  }
                  if (node.isDirectionalLight) {
                    _baseLight1 = node;
                    if (node.shadow) {
                      node.shadow.mapSize.width = 512;
                      node.shadow.mapSize.height = 512;
                      node.shadow.radius = LIGHTING_CONFIG.shadow_radius_ambient;
                      if (node.shadow.camera) {
                        node.shadow.camera.left = -0.30;
                        node.shadow.camera.right = 0.30;
                        node.shadow.camera.top = 0.30;
                        node.shadow.camera.bottom = -0.30;
                        node.shadow.camera.near = 0.1;
                        node.shadow.camera.far = 10;
                        node.shadow.camera.updateProjectionMatrix();
                      }
                      if (node.shadow.map) {
                        node.shadow.map.dispose();
                        node.shadow.map = null;
                      }
                    }
                  }
                });

                // 1. Instanciamos Luz 2 (Activa inicial con modelado a 45º)
                slotLight2.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight2.light.position.set(0, 1.5, -1.5);
                slotLight2.light.castShadow = LIGHTING_CONFIG.light2_castShadow;
                _scene.add(slotLight2.light);
                _scene.add(slotLight2.light.target);

                // 2. Instanciamos Luz 3 (Durmiente inicial)
                slotLight3.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight3.light.position.set(
                  LIGHTING_CONFIG.light3_default_pos[0],
                  LIGHTING_CONFIG.light3_default_pos[1],
                  LIGHTING_CONFIG.light3_default_pos[2]
                );
                slotLight3.light.castShadow = LIGHTING_CONFIG.light3_castShadow;
                _scene.add(slotLight3.light);
                _scene.add(slotLight3.light.target);

                // 3. Instanciamos Luz 4 (Durmiente inicial)
                slotLight4.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight4.light.position.set(
                  LIGHTING_CONFIG.light4_default_pos[0],
                  LIGHTING_CONFIG.light4_default_pos[1],
                  LIGHTING_CONFIG.light4_default_pos[2]
                );
                slotLight4.light.castShadow = LIGHTING_CONFIG.light4_castShadow;
                _scene.add(slotLight4.light);
                _scene.add(slotLight4.light.target);

                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  } else {
                    log('Error: No se pudo instanciar el cargador.');
                  }
                });
              } else {
                log('Error: window.THREE nativo no encontrado.');
              }

            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => {
            log('Error al descargar RGBELoader: ' + err.message);
            resolve(null);
          });
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        const LOAD_HDR = true;
        
        if (LOAD_HDR) {
          new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
            hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            originalEnv = hdr;
            if (envMode === 'hdr') scene.environment = hdr;
          }, undefined, (err) => {
            log('Error cargando HDR: ' + err.message);
          });
        }

        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);

            /* =====================================================================================
               SISTEMA LIGHT ESTIMATION ANTERIOR (v2.94) - COMENTADO PARA RECUPERACIÓN FUTURA
               -------------------------------------------------------------------------------------
               const lightEstimationSize = 4;
               const lightEstimationInterval = 1000;
               const lightCanvas = document.createElement('canvas');
               lightCanvas.width = lightEstimationSize;
               lightCanvas.height = lightEstimationSize;
               const lightCtx = lightCanvas.getContext('2d');

               envInterval = setInterval(() => {
                 try {
                   if (!video || video.readyState < 2) return;
                   lightCtx.drawImage(video, 0, 0, lightEstimationSize, lightEstimationSize);
                   const pixels = lightCtx.getImageData(0, 0, lightEstimationSize, lightEstimationSize).data;
                   let total = 0;
                   for (let i = 0; i < pixels.length; i += 4) {
                     total += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                   }
                   const brightness = total / (pixels.length / 4);
                   smoothed += (brightness - smoothed) * 0.08;

                   renderer.toneMappingExposure = 0.6 + (smoothed / 255) * 1.9; 
                 } catch (e) {
                   // Silencioso
                 }
               }, lightEstimationInterval);
            ===================================================================================== */

            // === CONFIGURACIÓN DEL PMREM Y CARRUSEL TÁNDEM (v3.16) ===
            const pmremSize = LIGHTING_CONFIG.pmrem_resolution;
            const pmremInterval = LIGHTING_CONFIG.pmrem_interval_ms;
            const pmremCanvas = document.createElement('canvas');
            pmremCanvas.width = pmremSize;
            pmremCanvas.height = pmremSize;
            const pmremCtx = pmremCanvas.getContext('2d', { willReadFrequently: true });
            
            const envTexture = new THREE_INSTANCE.CanvasTexture(pmremCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            if (THREE_INSTANCE.sRGBEncoding) {
              envTexture.encoding = THREE_INSTANCE.sRGBEncoding;
            }

            let smoothedBrightness = 0;
            let targetLightX = pmremSize * 0.5;
            let targetLightY = pmremSize * 0.3;
            
            let lastScanTime = 0;
            const scanInterval = LIGHTING_CONFIG.scan_interval_ms;
            let targetExposure = 0.0;

            const probeNDC = new THREE_INSTANCE.Vector3();
            const camWorldPos = new THREE_INSTANCE.Vector3();
            const rayDir = new THREE_INSTANCE.Vector3();
            const candidatePos = new THREE_INSTANCE.Vector3();

            const aplicarRestriccionesMesa = (outVec, origin, dir, dist) => {
              outVec.copy(origin).addScaledVector(dir, dist);
              if (outVec.length() > LIGHTING_CONFIG.max_light_radius) {
                outVec.setLength(LIGHTING_CONFIG.max_light_radius);
              }
              outVec.y = Math.max(LIGHTING_CONFIG.min_light_height, outVec.y);
            };

            const iniciarFadeInSlot = (slot, destPos, destIntensity, newDir, now) => {
              slot.state = 'fading_in';
              slot.lastAnchorTime = now;
              slot.transition.startTime = now;
              slot.transition.startIntensity = slot.light ? slot.light.intensity : 0.0;
              slot.transition.destIntensity = destIntensity;
              slot.transition.destPos.copy(destPos);
              slot.transition.destDir.copy(newDir);
              if (slot.light) slot.light.position.copy(destPos);
            };

            const iniciarFadeOutLRU = (slot, destPos, destIntensity, newDir, now) => {
              slot.state = 'fading_out';
              slot.transition.startTime = now;
              slot.transition.startIntensity = slot.light ? slot.light.intensity : 0.0;
              slot.transition.destIntensity = destIntensity;
              slot.transition.destPos.copy(destPos);
              slot.transition.destDir.copy(newDir);
            };

            // Suelo de rugosidad a 0.20 para evitar el parpadeo en tomates y vajillas brillantes
            const aplicarSueloRugosidad = () => {
              if (!_scene) return;
              _scene.traverse((child) => {
                if (child.isMesh && child.material) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  mats.forEach((mat) => {
                    const isMetal = mat.metalness !== undefined && mat.metalness > LIGHTING_CONFIG.metalness_bypass_threshold;
                    if (!isMetal && mat.roughness !== undefined && mat.roughness < LIGHTING_CONFIG.min_material_roughness) {
                      mat.roughness = LIGHTING_CONFIG.min_material_roughness;
                      mat.needsUpdate = true;
                    }
                  });
                }
              });
            };

            const lumaBins = new Int32Array(16);

            setInterval(() => {
              try {
                if (!video || video.readyState < 2 || !pmremGenerator) return;

                const now = performance.now();
                const deltaSec = Math.max(0.001, (now - lastFrameTime) / 1000.0);
                lastFrameTime = now;

                // 1. DIBUJAMOS EL VÍDEO REAL LIMPIO
                pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);

                // --- COLOCACIÓN INICIAL FIJA DE LUZ 2 A 45º (Modelado y Especulares desde Frame 1) ---
                if (!light2InitialPlaced && _activeCamera) {
                  _activeCamera.getWorldPosition(camWorldPos);
                  const camDistXZ = Math.hypot(camWorldPos.x, camWorldPos.z) || 1.0;
                  const mirrorX = -(camWorldPos.x / camDistXZ);
                  const mirrorZ = -(camWorldPos.z / camDistXZ);
                  
                  const elevAngle = Math.PI / 4.0; // 45 grados de elevación
                  const r = LIGHTING_CONFIG.light2_distance;
                  const initY = Math.max(LIGHTING_CONFIG.min_light_height, Math.sin(elevAngle) * r);
                  const initXZ = Math.cos(elevAngle) * r;

                  if (slotLight2.light) {
                    slotLight2.light.position.set(mirrorX * initXZ, initY, mirrorZ * initXZ);
                    slotLight2.anchoredDir.copy(slotLight2.light.position).normalize();
                    slotLight2.isAnchored = true;
                    slotLight2.state = 'active';
                    slotLight2.lastAnchorTime = now;
                    light2InitialPlaced = true;
                    actualizarContadorLuces();
                  }
                }

                // 2. ESCANEO AMBIENTAL Y ANÁLISIS DE FOCOS (v3.16)
                if (now - lastScanTime > scanInterval) {
                  lastScanTime = now;
                  
                  const scanEmitterHeight = Math.floor(pmremSize * LIGHTING_CONFIG.upper_half_limit);
                  const imgData = pmremCtx.getImageData(0, 0, pmremSize, pmremSize);
                  const data = imgData.data;

                  let sumR = 0, sumG = 0, sumB = 0;
                  let maxLum = 0;
                  let count = 0;
                  let clippingCount = 0;
                  let clippingSumX = 0, clippingSumY = 0;

                  lumaBins.fill(0);

                  // Escaneo del 100% de la pantalla para la Estrategia Servilleta (P90)
                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    const pixelIdx = idx / 4;
                    const px = pixelIdx % pmremSize;
                    const py = Math.floor(pixelIdx / pmremSize);

                    sumR += r;
                    sumG += g;
                    sumB += b;
                    count++;

                    // Histograma de 16 bins para P90
                    const binIdx = Math.min(15, Math.floor((lum / 256) * 16));
                    lumaBins[binIdx]++;

                    if (lum > maxLum) {
                      maxLum = lum;
                    }

                    // Detección estricta de emisor real por saturación en los 3 canales RGB en mitad superior
                    if (py < scanEmitterHeight && 
                        r >= LIGHTING_CONFIG.emitter_clipping_threshold && 
                        g >= LIGHTING_CONFIG.emitter_clipping_threshold && 
                        b >= LIGHTING_CONFIG.emitter_clipping_threshold) {
                      clippingCount++;
                      clippingSumX += px;
                      clippingSumY += py;
                    }
                  }

                  const avgR = count > 0 ? sumR / count : 0;
                  const avgG = count > 0 ? sumG / count : 0;
                  const avgB = count > 0 ? sumB / count : 0;
                  const avgLum = (avgR * 0.299 + avgG * 0.587 + avgB * 0.114);

                  // Extracción P90 al 100% de la pantalla (Estrategia Servilleta)
                  let p90Lum = avgLum;
                  let accumulated = 0;
                  const p90Target = count * 0.90;
                  for (let b = 0; b < 16; b++) {
                    accumulated += lumaBins[b];
                    if (accumulated >= p90Target) {
                      p90Lum = ((b + 0.5) / 16) * 255;
                      break;
                    }
                  }

                  const effectiveIlluminance = (avgLum * LIGHTING_CONFIG.avg_weight) + (p90Lum * LIGHTING_CONFIG.p90_weight);

                  // Centro de masas del foco en mitad superior
                  const lumThreshold = Math.max(70, maxLum * 0.80);
                  let weightedSumX = 0;
                  let weightedSumY = 0;
                  let blobWeight = 0;
                  let blobPixelCount = 0;

                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    const pixelIdx = idx / 4;
                    const py = Math.floor(pixelIdx / pmremSize);

                    if (py < scanEmitterHeight && lum >= lumThreshold) {
                      const px = pixelIdx % pmremSize;
                      const weight = lum - lumThreshold + 1;

                      weightedSumX += px * weight;
                      weightedSumY += py * weight;
                      blobWeight += weight;
                      blobPixelCount++;
                    }
                  }

                  if (clippingCount > 0) {
                    targetLightX = clippingSumX / clippingCount;
                    targetLightY = clippingSumY / clippingCount;
                  } else if (blobWeight > 0) {
                    targetLightX = weightedSumX / blobWeight;
                    targetLightY = Math.max(2, Math.min(scanEmitterHeight, weightedSumY / blobWeight));
                  } else {
                    targetLightX = pmremSize * 0.5;
                    targetLightY = scanEmitterHeight * 0.5;
                  }

                  // Filtros estrictos anti-falsos positivos
                  const contrastDelta = maxLum - avgLum;
                  const temporalDrop = previousAvgLum - avgLum;
                  previousAvgLum = avgLum;

                  const blobAreaRatio = count > 0 ? (blobPixelCount / count) : 0;
                  let areaDiffuseFactor = 1.0;
                  if (blobAreaRatio > LIGHTING_CONFIG.large_area_threshold) {
                    areaDiffuseFactor = Math.max(0.60, 1.0 - (blobAreaRatio - LIGHTING_CONFIG.large_area_threshold) * 2.0);
                  }

                  const isClippingEmitter = (clippingCount > 0);
                  const isObviousLight = isClippingEmitter || ((maxLum >= LIGHTING_CONFIG.obvious_lum_threshold) && 
                    ((contrastDelta >= LIGHTING_CONFIG.contrast_delta_threshold) || (temporalDrop >= LIGHTING_CONFIG.temporal_drop_threshold)));

                  if (isObviousLight) hasDetectedDirectLight = true;

                  smoothedBrightness += (effectiveIlluminance - smoothedBrightness) * LIGHTING_CONFIG.reaction_speed;
                  const normalizedBrightness = Math.max(0.0, Math.min(1.0, smoothedBrightness / 255));

                  let boostFactor = 1.0;
                  if (maxLum > LIGHTING_CONFIG.boost_lum_threshold) {
                    const boostRatio = (maxLum - LIGHTING_CONFIG.boost_lum_threshold) / (255 - LIGHTING_CONFIG.boost_lum_threshold);
                    boostFactor = 1.0 + boostRatio * (LIGHTING_CONFIG.boost_multiplier - 1.0);
                  }

                  // Paridad total de intensidades: techo rotundo en 2.60
                  const baseDirectIntensity = normalizedBrightness * LIGHTING_CONFIG.light_maxIntensity * boostFactor * areaDiffuseFactor;
                  
                  slotLight2.targetIntensity = isObviousLight ? baseDirectIntensity : (baseDirectIntensity * LIGHTING_CONFIG.light2_initialRatio);
                  slotLight3.targetIntensity = baseDirectIntensity;
                  slotLight4.targetIntensity = baseDirectIntensity;

                  // --- DESPROYECCIÓN ESPACIAL Y CARRUSEL TÁNDEM LRU (v3.16) ---
                  if (_activeCamera && isObviousLight) {
                    const ndcX = (targetLightX / pmremSize) * 2 - 1;
                    const ndcY = 1 - (targetLightY / pmremSize) * 2;

                    _activeCamera.getWorldPosition(camWorldPos);
                    probeNDC.set(ndcX, ndcY, 0.5);
                    probeNDC.unproject(_activeCamera);
                    rayDir.subVectors(probeNDC, camWorldPos).normalize();

                    aplicarRestriccionesMesa(candidatePos, camWorldPos, rayDir, LIGHTING_CONFIG.light2_distance);

                    // Comprobamos separación angular (>30º) respecto a todas las luces ancladas
                    let isInsideExistingCone = false;
                    carruselSlots.forEach(slot => {
                      if (slot.isAnchored && rayDir.angleTo(slot.anchoredDir) < LIGHTING_CONFIG.min_separation_angle) {
                        isInsideExistingCone = true;
                      }
                    });

                    // Si es una fuente nueva a >30º: asignamos ranuras y sumamos al contador acumulativo
                    if (!isInsideExistingCone) {
                      if (!slotLight3.isAnchored && slotLight3.state === 'idle') {
                        iniciarFadeInSlot(slotLight3, candidatePos, baseDirectIntensity, rayDir, now);
                        totalLightsDetected++;
                        actualizarContadorLuces();
                      } else if (!slotLight4.isAnchored && slotLight4.state === 'idle') {
                        iniciarFadeInSlot(slotLight4, candidatePos, baseDirectIntensity, rayDir, now);
                        totalLightsDetected++;
                        actualizarContadorLuces();
                      } else {
                        // Las 3 ranuras están ocupadas: reciclamos la ranura LRU más antigua
                        let lruSlot = null;
                        let oldestTime = Infinity;
                        carruselSlots.forEach(slot => {
                          if (slot.state === 'active' && slot.lastAnchorTime < oldestTime) {
                            oldestTime = slot.lastAnchorTime;
                            lruSlot = slot;
                          }
                        });

                        if (lruSlot) {
                          iniciarFadeOutLRU(lruSlot, candidatePos, baseDirectIntensity, rayDir, now);
                          totalLightsDetected++;
                          actualizarContadorLuces();
                        }
                      }
                    }
                  }

                  // --- BALANCE ESCALONADO PMREM vs LUCES (60% -> 55% -> 50%) ---
                  let activeLightsCount = 0;
                  carruselSlots.forEach(s => {
                    if (s.state === 'active' || s.state === 'fading_in') activeLightsCount++;
                  });
                  activeLightsCount = Math.max(1, activeLightsCount);

                  let pmremScale = 0.60;
                  if (activeLightsCount === 2) {
                    pmremScale = 0.55;
                  } else if (activeLightsCount >= 3) {
                    pmremScale = 0.50;
                  }

                  targetExposure = normalizedBrightness * LIGHTING_CONFIG.exposure_mult * pmremScale;

                  // --- SOMBRAS INTERACTIVAS SUAVES ---
                  if (_baseLight1 && _baseLight1.shadow) {
                    const targetRadius = hasDetectedDirectLight ? LIGHTING_CONFIG.shadow_radius_direct : LIGHTING_CONFIG.shadow_radius_ambient;
                    _baseLight1.shadow.radius += (targetRadius - _baseLight1.shadow.radius) * 0.10;
                  }
                  if (_groundMesh && _groundMesh.material) {
                    const targetOpacity = hasDetectedDirectLight ? LIGHTING_CONFIG.ground_opacity_direct : LIGHTING_CONFIG.ground_opacity_ambient;
                    _groundMesh.material.opacity += (targetOpacity - _groundMesh.material.opacity) * 0.10;
                  }
                }

                // 3. ACTUALIZACIÓN CINEMÁTICA CON CURVAS CALIBRADAS (800ms subida / 4000ms caída)
                if (_activeCamera) {
                  _activeCamera.getWorldDirection(rayDir);
                }

                carruselSlots.forEach(slot => {
                  if (!slot.light) return;
                  slot.light.target.position.set(0, 0, 0);

                  if (slot.state === 'fading_out') {
                    const elapsed = now - slot.transition.startTime;
                    const progress = Math.min(1.0, elapsed / LIGHTING_CONFIG.wake_duration_ms);
                    slot.light.intensity = THREE_INSTANCE.MathUtils.lerp(slot.transition.startIntensity, 0.0, progress);

                    if (progress >= 1.0) {
                      slot.light.position.copy(slot.transition.destPos);
                      slot.anchoredDir.copy(slot.transition.destDir);
                      slot.anchoredIntensity = slot.transition.destIntensity;
                      slot.state = 'fading_in';
                      slot.lastAnchorTime = now;
                      slot.transition.startTime = now;
                      slot.transition.startIntensity = 0.0;
                    }
                  } else if (slot.state === 'fading_in') {
                    const elapsed = now - slot.transition.startTime;
                    const progress = Math.min(1.0, elapsed / LIGHTING_CONFIG.wake_duration_ms);
                    slot.light.intensity = THREE_INSTANCE.MathUtils.lerp(slot.transition.startIntensity, slot.transition.destIntensity, progress);

                    if (progress >= 1.0) {
                      slot.state = 'active';
                      slot.isAnchored = true;
                      slot.anchoredIntensity = slot.transition.destIntensity;
                    }
                  } else if (slot.state === 'active') {
                    const isFacing = _activeCamera ? (rayDir.angleTo(slot.anchoredDir) < LIGHTING_CONFIG.min_separation_angle) : true;
                    const effectiveTarget = isFacing 
                      ? slot.targetIntensity 
                      : (slot.anchoredIntensity * LIGHTING_CONFIG.out_of_frame_retention);

                    // Curva asimétrica: 800ms si sube, 4000ms si decae fuera de cuadro
                    const isRising = effectiveTarget > slot.light.intensity;
                    const speed = isRising ? (1000.0 / LIGHTING_CONFIG.wake_duration_ms) : (1000.0 / LIGHTING_CONFIG.decay_duration_ms);
                    const lerpStep = Math.min(1.0, speed * deltaSec);
                    
                    slot.light.intensity += (effectiveTarget - slot.light.intensity) * lerpStep;
                  } else if (slot.state === 'idle') {
                    slot.light.intensity = 0.0;
                  }
                });

                // Exposición adaptativa templada
                renderer.toneMappingExposure += (targetExposure - renderer.toneMappingExposure) * LIGHTING_CONFIG.reaction_speed;

                // Suelo de rugosidad dinámico para proteger los tomates cherry
                aplicarSueloRugosidad();

                // 4. ACTUALIZACIÓN PMREM (Reflejo de cámara puro sin deformaciones)
                envTexture.needsUpdate = true;
                const oldRT = cameraRT;
                cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                if (envMode === 'cam') scene.environment = cameraRT.texture;
                if (oldRT) oldRT.dispose();

              } catch (e) {
                // Silencioso
              }
            }, pmremInterval);
          }
        }, 500);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];

          if (obj.name === 'Directional Light') {
            if (obj.light) {
              obj.light.intensity = LIGHTING_CONFIG.light1_intensity;
            }
          }

          if (obj.name === 'Model') {
            obj.scale = [1.01, 1.01, 1.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) {
        log('Error: _scene sigue siendo null');
        return;
      }
      
      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) {
          _scene.environment = originalEnv;
          envMode = 'hdr';
          if (btn) btn.innerText = 'Env: HDR';
        } else {
          if (cameraRT) {
            _scene.environment = cameraRT.texture;
            envMode = 'cam';
            if (btn) btn.innerText = 'Env: CAM';
          } else {
            _scene.environment = null;
            envMode = 'off';
            if (btn) btn.innerText = 'Env: OFF';
          }
        }
      }
    };
  </script>

  <script src="bundle-world.js"></script>
