<!-- 9th Wall v3.05 Apple Probe -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v3.05<br>
      bundle: v3.05<br>
      <span id="latencySpan" style="color:#0f0;">Latencia: -- ms</span>
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Env: CAM
  </button>

  <button id="debugToggle"
    style="position:fixed;bottom:20px;left:130px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Debug: OFF
  </button>

  <script>
    // =====================================================================================
    // === CONTROL DE ILUMINACIÓN (Consola Central de Calibración v3.05) ===
    // =====================================================================================
    const LIGHTING_CONFIG = {
      // --- INTENSIDADES Y MULTIPLICADORES ---
      light1_intensity: 0.00,        // Luz 1 (ECS Ground / Contact AO): 0.00 para sombra pura sin doble iluminación
      light2_maxIntensity: 1.30,     // Luz 2 (Clave / Especular): Intensidad máxima en entornos de alta luminosidad
      light2_minIntensity: 0.35,     // Luz 2: Intensidad mínima en penumbra / salas oscuras
      light3_ratio: 0.75,            // Luz 3 (Relleno lateral): Porcentaje estricto respecto a la Luz 2 (75%)
      
      // --- SOMBRAS DINÁMICAS ---
      light1_castShadow: true,       // Sombra de contacto base en el suelo (Ground)
      light2_castShadow: false,      // Sombra secundaria de Luz 2 (Desactivada en v3.05 para rendimiento)
      light3_castShadow: false,      // Sombra de Luz 3 (Falsa: luz de relleno puro sin coste GPU)
      
      // --- POSICIONAMIENTO 3D Y DESPROYECCIÓN (RAY UNPROJECTION) ---
      light2_distance: 2.8,          // Distancia en metros a lo largo del rayo real desproyectado de la cámara
      light3_position: [1.3, 0.40, 0.4], // Posición fija lateral derecha de Luz 3 [X, Y rasante, Z]
      
      // --- AMBIENTE Y TONE MAPPING ---
      exposure_base: 0.25,           // Exposición mínima del Tone Mapping (ACES Filmic)
      exposure_mult: 0.75,           // Factor multiplicador de exposición basado en brillo ambiental
      
      // --- LIGHT PROBE EN CANVAS (HDR SCREEN BLOB) ---
      probe_radius: 100,             // Radio del foco aditivo en canvas (v3.05 = 100 para reflejo amplio tipo Apple)
      
      // --- LIGHT ESTIMATION: RESOLUCIÓN Y TIEMPOS ---
      pmrem_resolution: 128,         // Tamaño del canvas PMREM (128x128 píxeles)
      pmrem_interval_ms: 150,        // Frecuencia de actualización de la textura PMREM (cada 150 ms)
      scan_interval_ms: 900,         // Frecuencia de escaneo del tercio superior (cada 900 ms)
      scan_height_ratio: 0.35,       // Porcentaje vertical superior analizado (35% = solo lámparas/techo)
      scan_pixel_step: 16            // Paso de muestreo en bytes (16 bytes = cada 4 píxeles para alta resolución)
    };
    // =====================================================================================

    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);
    
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'cam'; // Iniciamos por defecto en CAM ya que el HDR está inactivo para optimizar
    let envInterval = null;
    let _scene = null, _renderer = null, _activeCamera = null;

    // Referencias a las luces físicas de Three.js nativo (liberadas del cerrojo de ECS)
    let dynamicLight2 = null; // Luz 2: Clave + Especular dinámico desproyectado
    let dynamicLight3 = null; // Luz 3: Relleno lateral derecho (75% potencia de Luz 2)
    let targetLight2Color = null; // Color muestreado del foco principal
    let targetLight3Color = null; // Color muestreado del ambiente superior

    document.getElementById('envToggle').addEventListener('click', (e) => {
      toggleEnv();
    });

    // Control de persistencia y lógica del botón Debug
    const isDebugActive = sessionStorage.getItem("debug_features") === "true";
    const debugToggleBtn = document.getElementById('debugToggle');
    if (debugToggleBtn) {
      debugToggleBtn.innerText = isDebugActive ? "Debug: ON" : "Debug: OFF";
      debugToggleBtn.style.borderColor = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.style.color = isDebugActive ? "#0f0" : "white";
      
      debugToggleBtn.addEventListener('click', () => {
        sessionStorage.setItem("debug_features", isDebugActive ? "false" : "true");
        window.location.reload();
      });
    }

    // === Acoplamiento sobre el THREE Nativo del motor ===
    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              _activeCamera = world.three.activeCamera;
              
              // Buscamos el THREE nativo expuesto globalmente por el runtime de 8th Wall
              const nativeTHREE = window.THREE;
              
              if (nativeTHREE) {
                // Activación de sombras dinámicas nativas
                _renderer.shadowMap.enabled = true;

                // === ACTIVACIÓN SEGURA DEL TONE MAPPING ===
                _renderer.toneMapping = nativeTHREE.ACESFilmicToneMapping;

                // Inicializamos los colores objetivo para interpolación cromática suave
                targetLight2Color = new nativeTHREE.Color(0xffffff);
                targetLight3Color = new nativeTHREE.Color(0xffffff);

                // === FORZAR RESOLUCIÓN Y FRUSTUM DE SOMBRA BASE (Luz 1 en Ground) ===
                _scene.traverse((node) => {
                  if (node.isDirectionalLight) {
                    if (node.shadow) {
                      node.shadow.mapSize.width = 256; // <-- Modificar a mano aquí para pruebas (p.ej. 512, 256) -- Antes 128
                      node.shadow.mapSize.height = 256; // <-- Modificar a mano aquí para pruebas (p.ej. 512, 256) -- Antes 128
                      if (node.shadow.camera) {
                        node.shadow.camera.left = -0.30; // Antes -0.35
                        node.shadow.camera.right = 0.30; // Antes 0.35
                        node.shadow.camera.top = 0.30; // Antes 0.35
                        node.shadow.camera.bottom = -0.30; // Antes -0.35
                        node.shadow.camera.near = 0.1; // Antes 0.1
                        node.shadow.camera.far = 10; // Rango amplio de sombra base
                        node.shadow.camera.updateProjectionMatrix();
                      }
                      if (node.shadow.map) {
                        node.shadow.map.dispose();
                        node.shadow.map = null;
                      }
                    }
                  }
                });

                // === CREACIÓN NATIVA DIRECTA EN THREE.JS (Evita el bloqueo de posición de ECS) ===
                // 1. Instanciamos Luz 2 (Desproyectada en 3D, sombra configurable en LIGHTING_CONFIG)
                dynamicLight2 = new nativeTHREE.DirectionalLight(0xffffff, LIGHTING_CONFIG.light2_minIntensity);
                dynamicLight2.position.set(0, 1.8, 0);
                dynamicLight2.castShadow = LIGHTING_CONFIG.light2_castShadow;
                if (!LIGHTING_CONFIG.light2_castShadow && dynamicLight2.shadow && dynamicLight2.shadow.map) {
                  dynamicLight2.shadow.map.dispose();
                  dynamicLight2.shadow.map = null;
                }
                
                _scene.add(dynamicLight2);
                _scene.add(dynamicLight2.target);

                // 2. Instanciamos Luz 3 (Relleno lateral rasante a la derecha, sin sombra)
                dynamicLight3 = new nativeTHREE.DirectionalLight(0xffffff, LIGHTING_CONFIG.light2_minIntensity * LIGHTING_CONFIG.light3_ratio);
                dynamicLight3.position.set(
                  LIGHTING_CONFIG.light3_position[0],
                  LIGHTING_CONFIG.light3_position[1],
                  LIGHTING_CONFIG.light3_position[2]
                );
                dynamicLight3.castShadow = LIGHTING_CONFIG.light3_castShadow;
                _scene.add(dynamicLight3);
                _scene.add(dynamicLight3.target);

                // Descargamos y registramos RGBELoader directamente en el THREE nativo
                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  } else {
                    log('Error: No se pudo instanciar el cargador.');
                  }
                });
              } else {
                log('Error: window.THREE nativo no encontrado.');
              }

            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    // Descarga dinámica de RGBELoader sobre la instancia nativa del motor
    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            // Evaluamos el código del loader forzando el ámbito del THREE nativo de 8th Wall
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => {
            log('Error al descargar RGBELoader: ' + err.message);
            resolve(null);
          });
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        // Inicializamos PMREM usando la clase nativa del motor de 8th Wall
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        // === CONTROL DE CARGA DEL HDR (Configuración manual) ===
        const LOAD_HDR = true; // Cambiar a true para reactivar la descarga y uso del entorno HDR
        
        if (LOAD_HDR) {
          new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
            hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            originalEnv = hdr;
            if (envMode === 'hdr') scene.environment = hdr;
          }, undefined, (err) => {
            log('Error cargando HDR: ' + err.message);
          });
        } else {
          log('HDR desactivado (LOAD_HDR = false)');
        }

        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);

            /* =====================================================================================
               SISTEMA LIGHT ESTIMATION ANTERIOR (v2.94) - COMENTADO PARA RECUPERACIÓN FUTURA
               -------------------------------------------------------------------------------------
               const lightEstimationSize = 4;
               const lightEstimationInterval = 1000;
               const lightCanvas = document.createElement('canvas');
               lightCanvas.width = lightEstimationSize;
               lightCanvas.height = lightEstimationSize;
               const lightCtx = lightCanvas.getContext('2d');

               envInterval = setInterval(() => {
                 try {
                   if (!video || video.readyState < 2) return;
                   lightCtx.drawImage(video, 0, 0, lightEstimationSize, lightEstimationSize);
                   const pixels = lightCtx.getImageData(0, 0, lightEstimationSize, lightEstimationSize).data;
                   let total = 0;
                   for (let i = 0; i < pixels.length; i += 4) {
                     total += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                   }
                   const brightness = total / (pixels.length / 4);
                   smoothed += (brightness - smoothed) * 0.08;

                   // LUZ PMREM LIGHT Ajuste de exposición basado en brillo promedio. Valores anteriores 0.4 y 1.5 respectively.
                   renderer.toneMappingExposure = 0.6 + (smoothed / 255) * 1.9; 
                 } catch (e) {
                   // Silencioso
                 }
               }, lightEstimationInterval);
            ===================================================================================== */

            // === CONFIGURACIÓN DEL PMREM Y CONTROL DINÁMICO 3D (v3.05) ===
            const pmremSize = LIGHTING_CONFIG.pmrem_resolution;
            const pmremInterval = LIGHTING_CONFIG.pmrem_interval_ms;
            const pmremCanvas = document.createElement('canvas');
            pmremCanvas.width = pmremSize;
            pmremCanvas.height = pmremSize;
            const pmremCtx = pmremCanvas.getContext('2d', { willReadFrequently: true });
            const envTexture = new THREE_INSTANCE.CanvasTexture(pmremCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;

            let smoothedBrightness = 120; // Valor suavizado para la exposición automática
            let smoothedLightX = pmremSize * 0.5; // Posición X suavizada del foco en el techo
            let smoothedLightY = pmremSize * 0.15; // Posición Y suavizada del foco en el techo
            let targetLightX = pmremSize * 0.5;
            let targetLightY = pmremSize * 0.15;
            
            let lastScanTime = 0;
            const scanInterval = LIGHTING_CONFIG.scan_interval_ms;

            // Control de arranque cinematográfico de 1 segundo
            let startupStartTime = performance.now();
            const startupDuration = 1000;
            const initialLightPos = new THREE_INSTANCE.Vector3(0, 1.8, 0);
            const targetLight3DPos = new THREE_INSTANCE.Vector3(0, 1.8, 0);

            // Vectores auxiliares para desproyección espacial 3D
            const probeNDC = new THREE_INSTANCE.Vector3();
            const camWorldPos = new THREE_INSTANCE.Vector3();
            const rayDir = new THREE_INSTANCE.Vector3();

            setInterval(() => {
              try {
                if (!video || video.readyState < 2 || !pmremGenerator) return;

                const now = performance.now();

                // 1. DIBUJAMOS EL VÍDEO COMPLETO EN EL CANVAS
                pmremCtx.globalCompositeOperation = 'source-over';
                pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);

                // 2. ESCANEO DEL TERCIO SUPERIOR CON CENTRO DE MASAS PONDERADO (v3.05)
                if (now - lastScanTime > scanInterval) {
                  lastScanTime = now;
                  
                  const scanHeight = Math.floor(pmremSize * LIGHTING_CONFIG.scan_height_ratio);
                  const imgData = pmremCtx.getImageData(0, 0, pmremSize, scanHeight);
                  const data = imgData.data;

                  let sumR = 0, sumG = 0, sumB = 0;
                  let maxLum = 0;
                  let count = 0;

                  // Paso 1: Muestreo a paso de 4 píxeles para detectar con precisión el foco más brillante
                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    sumR += r;
                    sumG += g;
                    sumB += b;
                    count++;

                    if (lum > maxLum) {
                      maxLum = lum;
                    }
                  }

                  const avgR = sumR / count;
                  const avgG = sumG / count;
                  const avgB = sumB / count;
                  const avgLum = (avgR * 0.299 + avgG * 0.587 + avgB * 0.114);

                  // Paso 2: Centro de masas ponderado del foco principal
                  const lumThreshold = Math.max(70, maxLum * 0.75);
                  let weightedSumX = 0;
                  let weightedSumY = 0;
                  let blobWeight = 0;
                  let blobR = 0, blobG = 0, blobB = 0;

                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    if (lum >= lumThreshold) {
                      const pixelIdx = idx / 4;
                      const px = pixelIdx % pmremSize;
                      const py = Math.floor(pixelIdx / pmremSize);
                      const weight = lum - lumThreshold + 1;

                      weightedSumX += px * weight;
                      weightedSumY += py * weight;
                      blobR += r * weight;
                      blobG += g * weight;
                      blobB += b * weight;
                      blobWeight += weight;
                    }
                  }

                  if (blobWeight > 0) {
                    targetLightX = weightedSumX / blobWeight;
                    targetLightY = Math.max(2, Math.min(scanHeight, weightedSumY / blobWeight));

                    // Extracción del color dominante del foco (Luz 2)
                    if (targetLight2Color) {
                      targetLight2Color.setRGB(
                        (blobR / blobWeight) / 255,
                        (blobG / blobWeight) / 255,
                        (blobB / blobWeight) / 255
                      );
                    }
                  } else {
                    targetLightX = pmremSize * 0.5;
                    targetLightY = scanHeight * 0.5;
                    if (targetLight2Color) targetLight2Color.setRGB(1, 1, 1);
                  }

                  // Extracción del color ambiental general del entorno (Luz 3)
                  if (targetLight3Color) {
                    targetLight3Color.setRGB(avgR / 255, avgG / 255, avgB / 255);
                  }

                  // Suavizado del brillo ambiental y ajuste de exposición
                  smoothedBrightness += (avgLum - smoothedBrightness) * 0.10;
                  const normalizedBrightness = Math.max(0.0, Math.min(1.0, smoothedBrightness / 255));
                  renderer.toneMappingExposure = LIGHTING_CONFIG.exposure_base + (normalizedBrightness * LIGHTING_CONFIG.exposure_mult);
                }

                // 3. LERP CINEMATOGRÁFICO DE POSICIÓN 2D DEL PROBE
                smoothedLightX += (targetLightX - smoothedLightX) * 0.04;
                smoothedLightY += (targetLightY - smoothedLightY) * 0.04;

                // 4. SUPERPOSICIÓN ADITIVA DEL FOCO EN EL CANVAS (Radio 100 configurado)
                pmremCtx.globalCompositeOperation = 'screen';

                const lightRadius = LIGHTING_CONFIG.probe_radius;
                const grad = pmremCtx.createRadialGradient(
                  smoothedLightX, smoothedLightY, 2,
                  smoothedLightX, smoothedLightY, lightRadius
                );
                grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
                grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.90)');
                grad.addColorStop(0.5, 'rgba(255, 245, 220, 0.60)');
                grad.addColorStop(0.8, 'rgba(255, 230, 180, 0.20)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                pmremCtx.fillStyle = grad;
                pmremCtx.beginPath();
                pmremCtx.arc(smoothedLightX, smoothedLightY, lightRadius, 0, Math.PI * 2);
                pmremCtx.fill();

                pmremCtx.globalCompositeOperation = 'source-over';

                // 5. ENLACE DINÁMICO Y DESPROYECCIÓN 3D DE LAS LUCES NATIVAS (v3.05)
                const elapsedStartup = now - startupStartTime;
                const startupProgress = Math.min(1.0, elapsedStartup / startupDuration);
                const normalizedBrightness = Math.max(0.0, Math.min(1.0, smoothedBrightness / 255));

                // Intensidad dinámica de Luz 2 gobernada por la estimación de luz
                const dynamicIntensity2 = LIGHTING_CONFIG.light2_minIntensity + 
                  (normalizedBrightness * (LIGHTING_CONFIG.light2_maxIntensity - LIGHTING_CONFIG.light2_minIntensity));

                // --- CONTROL DE LUZ 2 (Clave + Especular) ---
                if (dynamicLight2) {
                  // Intensidad proporcional vinculada al brillo de la cámara
                  dynamicLight2.intensity = dynamicIntensity2 * startupProgress;

                  // Tono cromático en tiempo real
                  if (targetLight2Color) {
                    dynamicLight2.color.lerp(targetLight2Color, 0.05);
                  }

                  // DESPROYECCIÓN 3D EXACTA DESDE LA CÁMARA (Ray Unprojection):
                  // Convertimos la coordenada 2D del probe en coordenadas normalizadas de pantalla (NDC)
                  const ndcX = (smoothedLightX / pmremSize) * 2 - 1; // -1 (Izquierda) a +1 (Derecha)
                  const ndcY = 1 - (smoothedLightY / (pmremSize * LIGHTING_CONFIG.scan_height_ratio)) * 0.8; // Parte superior del frustum

                  if (_activeCamera) {
                    _activeCamera.getWorldPosition(camWorldPos);
                    
                    probeNDC.set(ndcX, ndcY, 0.5);
                    probeNDC.unproject(_activeCamera); // Punto 3D en el espacio del mundo proyectado por la cámara

                    rayDir.subVectors(probeNDC, camWorldPos).normalize();

                    // La luz física se posiciona a lo largo del rayo visual exacto
                    targetLight3DPos.copy(camWorldPos).addScaledVector(rayDir, LIGHTING_CONFIG.light2_distance);
                  } else {
                    targetLight3DPos.set(ndcX * 1.6, 1.4, 0.6);
                  }

                  dynamicLight2.position.lerpVectors(initialLightPos, targetLight3DPos, startupProgress);
                  dynamicLight2.target.position.set(0, 0, 0);
                }

                // --- CONTROL DE LUZ 3 (Relleno lateral rasante al 75% de la Luz 2) ---
                if (dynamicLight3) {
                  dynamicLight3.intensity = (dynamicLight2 ? dynamicLight2.intensity : dynamicIntensity2) * LIGHTING_CONFIG.light3_ratio;

                  if (targetLight3Color) {
                    dynamicLight3.color.lerp(targetLight3Color, 0.05);
                  }

                  dynamicLight3.position.set(
                    LIGHTING_CONFIG.light3_position[0],
                    LIGHTING_CONFIG.light3_position[1],
                    LIGHTING_CONFIG.light3_position[2]
                  );
                  dynamicLight3.target.position.set(0, 0, 0);
                }

                // 6. ACTUALIZACIÓN DE TEXTURA Y GENERACIÓN PMREM
                envTexture.needsUpdate = true;
                const oldRT = cameraRT;
                cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                if (envMode === 'cam') scene.environment = cameraRT.texture;
                if (oldRT) oldRT.dispose();

              } catch (e) {
                // Silencioso
              }
            }, pmremInterval);
          }
        }, 500);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    // Interceptor de la inicialización de ECS (Mantiene la estructura original estable)
    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];

          // Calibración de Luz 1 (Ground / AO) desde la consola unificada
          if (obj.name === 'Directional Light') {
            if (obj.light) {
              obj.light.intensity = LIGHTING_CONFIG.light1_intensity;
            }
          }

          if (obj.name === 'Model') {
            obj.scale = [1.01, 1.01, 1.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) {
        log('Error: _scene sigue siendo null');
        return;
      }
      
      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) {
          _scene.environment = originalEnv;
          envMode = 'hdr';
          if (btn) btn.innerText = 'Env: HDR';
        } else {
          if (cameraRT) {
            _scene.environment = cameraRT.texture;
            envMode = 'cam';
            if (btn) btn.innerText = 'Env: CAM';
          } else {
            _scene.environment = null;
            envMode = 'off';
            if (btn) btn.innerText = 'Env: OFF';
          }
        }
      }
    };
  </script>
