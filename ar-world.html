<!-- 9th Wall v3.42 Apple Probe -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v3.42<br>
      bundle: v3.10y<br>
      <span id="modeSpan" style="color:#0f0;">Modo: AUTO (--)</span><br>
      <span id="lightsCountSpan" style="color:#0f0;">Luces: 3</span><br>
      <span id="latencySpan" style="color:#0f0;">Latencia: -- ms</span>
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <!-- BARRA DE CONTROL INFERIOR (3 Botones limpios) -->
  <div id="controlsBar" style="position:fixed;bottom:15px;left:10px;right:10px;z-index:1000000;display:flex;gap:8px;justify-content:center;pointer-events:none;">
    <button id="envToggle" style="flex:1;max-width:110px;padding:9px 4px;border-radius:8px;border:1px solid white;background:rgba(0,0,0,0.75);color:white;font-size:12px;font-family:sans-serif;pointer-events:auto !important;text-align:center;">
      Env: CAM
    </button>
    <button id="debugToggle" style="flex:1;max-width:110px;padding:9px 4px;border-radius:8px;border:1px solid white;background:rgba(0,0,0,0.75);color:white;font-size:12px;font-family:sans-serif;pointer-events:auto !important;text-align:center;">
      Debug: OFF
    </button>
    <button id="modeToggle" style="flex:1;max-width:110px;padding:9px 4px;border-radius:8px;border:1px solid white;background:rgba(0,0,0,0.75);color:white;font-size:12px;font-family:sans-serif;pointer-events:auto !important;text-align:center;">
      Mode: AUTO
    </button>
  </div>

  <script>
    // =====================================================================================
    // === CONTROL DE ILUMINACIÓN (Consola Central de Calibración v3.42) ===
    // =====================================================================================
    const LIGHTING_CONFIG = {
      // --- INTENSIDADES BASE Y NIVELES LOOK v3.37 ---
      light1_intensity: 0.00,        // Luz 1 (ECS Ground / Cenital): 0.00 (apagada)
      light_maxIntensity: 3.40,      // Techo base de potencia directa (v3.37)
      
      // Ratios Modo DAY (Día / Sala Normal - Basado 100% en v3.37)
      day_light2_ratio: 2.18,        // Luz 2 Clave dominante a 40º (~7.41 peak)
      day_light3_ratio: 0.20,        // Luz 3 Relleno suave a 30º (~0.68 peak)
      day_light4_ratio: 0.44,        // Luz 4 Espejo/Contra a 40º (~1.50 peak)
      day_exposure_scale: 0.45,      // Escala maestra de exposición
      day_pedestal: 0.042,           // Pedestal emisivo calibrado v3.37
      
      // Ratios Modo NIGHT (Penumbra / Restaurante a oscuras)
      night_light2_ratio: 1.60,      // Luz 2 Clave moderada
      night_light3_ratio: 0.40,      // Luz 3 Relleno compensado
      night_light4_ratio: 0.50,      // Luz 4 Contra suave
      night_exposure_scale: 0.52,    // Levanta PMREM ambiental en penumbra
      night_pedestal: 0.045,         // Suaviza oclusiones profundas
      
      // --- SOBREIMPULSO POR FUENTES DIRECTAS POTENTES (> 235) ---
      boost_lum_threshold: 235,      // Umbral de luminancia para sobreimpulso
      boost_multiplier: 1.25,        // Multiplicador contenido
      
      // --- SOMBRAS DINÁMICAS (RADIO 5.2 Y OPACIDAD 0.45) ---
      shadow_map_size: 1024,         // Resolución de ShadowMap fijada a 1024x1024
      light1_castShadow: true,       // Sombra base cenital de contacto en el suelo (Ground)
      shadow_radius_fixed: 5.2,      // Radio difuso ajustado (+2 puntos: 3.2 -> 5.2)
      ground_opacity_fixed: 0.45,    // Opacidad fija equilibrada del suelo (0.45)
      light2_castShadow: false,      // Luz 2 sin sombras
      light3_castShadow: false,
      light4_castShadow: false,
      
      // --- RESTRICCIONES ESPACIALES (LUCES 2/4 A 40º, LUZ 3 A 30º) ---
      light_distance: 2.2,           // Distancia de proyección espacial
      min_light_height: 0.25,        // Altura mínima obligatoria (25 cm sobre el plano SLAM)
      elevation_angle_light2_4: (40.0 * Math.PI) / 180.0, // Ángulo a 40º para Luces 2 y 4
      elevation_angle_light3: (30.0 * Math.PI) / 180.0,   // Ángulo a 30º para Luz 3
      min_separation_angle: (35.0 * Math.PI) / 180.0,     // Cono de exclusión de 35º
      upper_third_limit: 0.35,       // Tercio superior para posición inicial de Luz 3
      
      // --- CALIBRACIÓN LOOK SCENE VIEWER ---
      min_material_roughness: 0.28,     // Suelo de rugosidad anti-titileo (0.28)
      metalness_bypass_threshold: 0.50, // Bypass: metales puros (> 0.5) como espejos
      albedo_desaturation: 0.12,        // Desaturación calibrada al 12%
      
      // --- AMBIENTE, TONE MAPPING Y P90 (v3.37 PURO) ---
      exposure_base: 0.00,           // Exposición base cero (si luz de sala es 0, luz 3D es 0)
      exposure_mult: 1.64,           // Multiplicador ambiental PMREM v3.37
      reaction_speed: 0.35,          // Factor de respuesta fluida v3.37
      p90_weight: 0.70,              // Peso del Percentil P90
      avg_weight: 0.30,              // Peso del promedio global
      
      // --- RENDIMIENTO PMREM 128x128 A 200 MS / ISO A 300 MS ---
      pmrem_resolution: 128,         // PMREM a 128x128
      pmrem_interval_ms: 200,        // Actualización PMREM GPU fija cada 200 ms
      scan_interval_ms: 300,         // Escaneo de ISO cada 300 ms
      scan_pixel_step: 8             // Muestreo en CPU sobre 128x128
    };
    // =====================================================================================

    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);
    
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'cam';
    let _scene = null, _renderer = null, _activeCamera = null, _groundMesh = null, _baseLight1 = null;

    // Configuración de Perfil (Auto / Day / Night)
    let savedMode = sessionStorage.getItem("ar_light_mode") || "AUTO"; // "AUTO" | "DAY" | "NIGHT"
    let currentProfile = "DAY"; // Se determina en Frame 1
    let activeRatios = {
      l2: LIGHTING_CONFIG.day_light2_ratio,
      l3: LIGHTING_CONFIG.day_light3_ratio,
      l4: LIGHTING_CONFIG.day_light4_ratio,
      expScale: LIGHTING_CONFIG.day_exposure_scale,
      pedestal: LIGHTING_CONFIG.day_pedestal
    };

    // Estructura para ranuras de luz direccional fijas (v3.37)
    const crearRanuraLuz = () => ({
      light: null,
      anchoredDir: null,
      targetIntensity: 0.0
    });

    const slotLight2 = crearRanuraLuz();
    const slotLight3 = crearRanuraLuz();
    const slotLight4 = crearRanuraLuz();
    const carruselSlots = [slotLight2, slotLight3, slotLight4];

    let previousAvgLum = 128;
    let initialLightsPlaced = false; // Se posicionan en Frame 1 y se apaga el rastreo
    let totalLightsDetected = 3; // Luces 2, 3 y 4 activas

    const actualizarContadorLuces = () => {
      const lightsSpan = document.getElementById('lightsCountSpan');
      if (lightsSpan) {
        lightsSpan.innerText = `Luces: ${totalLightsDetected}`;
      }
    };

    const actualizarIndicadorModo = () => {
      const modeSpan = document.getElementById('modeSpan');
      const modeBtn = document.getElementById('modeToggle');
      const label = (savedMode === "AUTO") ? `AUTO (${currentProfile})` : savedMode;
      if (modeSpan) modeSpan.innerText = `Modo: ${label}`;
      if (modeBtn) modeBtn.innerText = `Mode: ${savedMode}`;
    };

    // --- MANEJADORES DE BOTONES ---
    document.getElementById('envToggle').addEventListener('click', () => {
      toggleEnv();
    });

    const isDebugActive = sessionStorage.getItem("debug_features") === "true";
    const debugToggleBtn = document.getElementById('debugToggle');
    if (debugToggleBtn) {
      debugToggleBtn.innerText = isDebugActive ? "Debug: ON" : "Debug: OFF";
      debugToggleBtn.style.borderColor = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.style.color = isDebugActive ? "#0f0" : "white";
      
      debugToggleBtn.addEventListener('click', () => {
        sessionStorage.setItem("debug_features", isDebugActive ? "false" : "true");
        window.location.reload();
      });
    }

    const modeToggleBtn = document.getElementById('modeToggle');
    if (modeToggleBtn) {
      modeToggleBtn.innerText = `Mode: ${savedMode}`;
      modeToggleBtn.addEventListener('click', () => {
        let nextMode = "AUTO";
        if (savedMode === "AUTO") nextMode = "DAY";
        else if (savedMode === "DAY") nextMode = "NIGHT";
        else if (savedMode === "NIGHT") nextMode = "AUTO";
        
        sessionStorage.setItem("ar_light_mode", nextMode);
        window.location.reload();
      });
    }

    // === Acoplamiento sobre el THREE Nativo del motor ===
    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              _activeCamera = world.three.activeCamera;
              
              const nativeTHREE = window.THREE;
              
              if (nativeTHREE) {
                _renderer.shadowMap.enabled = true;
                _renderer.toneMapping = nativeTHREE.ACESFilmicToneMapping;

                carruselSlots.forEach(slot => {
                  slot.anchoredDir = new nativeTHREE.Vector3(0, 1, 0);
                });

                // Captura del Ground y Luz 1 (Ajuste de ShadowCamera a 50cm, radio 5.2 y opacidad 0.45)
                _scene.traverse((node) => {
                  if (node.isMesh && node.material && (node.material.type === 'ShadowMaterial' || node.name === 'Ground')) {
                    _groundMesh = node;
                    if (_groundMesh.material) {
                      _groundMesh.material.opacity = LIGHTING_CONFIG.ground_opacity_fixed;
                    }
                  }
                  if (node.isDirectionalLight) {
                    _baseLight1 = node;
                    node.intensity = LIGHTING_CONFIG.light1_intensity; // Luz ECS apagada a 0.00
                    if (node.shadow) {
                      node.shadow.mapSize.width = LIGHTING_CONFIG.shadow_map_size;
                      node.shadow.mapSize.height = LIGHTING_CONFIG.shadow_map_size;
                      node.shadow.radius = LIGHTING_CONFIG.shadow_radius_fixed;
                      if (node.shadow.camera) {
                        node.shadow.camera.left = -0.50;
                        node.shadow.camera.right = 0.50;
                        node.shadow.camera.top = 0.50;
                        node.shadow.camera.bottom = -0.50;
                        node.shadow.camera.near = 0.1;
                        node.shadow.camera.far = 10;
                        node.shadow.camera.updateProjectionMatrix();
                      }
                      if (node.shadow.map) {
                        node.shadow.map.dispose();
                        node.shadow.map = null;
                      }
                    }
                  }
                });

                // 1. Instanciamos Luz 2 (Clave a 40º)
                slotLight2.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight2.light.position.set(0, 1.41, -1.69);
                slotLight2.light.castShadow = LIGHTING_CONFIG.light2_castShadow;
                _scene.add(slotLight2.light);
                _scene.add(slotLight2.light.target);

                // 2. Instanciamos Luz 3 (Relleno a 30º)
                slotLight3.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight3.light.position.set(1.35, 1.10, -1.35);
                slotLight3.light.castShadow = LIGHTING_CONFIG.light3_castShadow;
                _scene.add(slotLight3.light);
                _scene.add(slotLight3.light.target);

                // 3. Instanciamos Luz 4 (Contra/Espejo a 40º)
                slotLight4.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight4.light.position.set(0, 1.41, 1.69);
                slotLight4.light.castShadow = LIGHTING_CONFIG.light4_castShadow;
                _scene.add(slotLight4.light);
                _scene.add(slotLight4.light.target);

                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  } else {
                    log('Error: No se pudo instanciar el cargador.');
                  }
                });
              } else {
                log('Error: window.THREE nativo no encontrado.');
              }

            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => {
            log('Error al descargar RGBELoader: ' + err.message);
            resolve(null);
          });
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        const LOAD_HDR = true;
        
        if (LOAD_HDR) {
          new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
            hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            originalEnv = hdr;
            if (envMode === 'hdr') scene.environment = hdr;
          }, undefined, (err) => {
            log('Error cargando HDR: ' + err.message);
          });
        }

        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);

            // === CONFIGURACIÓN DEL PMREM A 128x128 (v3.37) ===
            const pmremSize = LIGHTING_CONFIG.pmrem_resolution;
            const pmremCanvas = document.createElement('canvas');
            pmremCanvas.width = pmremSize;
            pmremCanvas.height = pmremSize;
            const pmremCtx = pmremCanvas.getContext('2d', { willReadFrequently: true });
            
            const envTexture = new THREE_INSTANCE.CanvasTexture(pmremCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            if (THREE_INSTANCE.sRGBEncoding) {
              envTexture.encoding = THREE_INSTANCE.sRGBEncoding;
            }

            let smoothedBrightness = 0;
            let targetExposure = 0.0;
            let lastScanTime = 0;
            let lastPmremTime = 0;

            const probeNDC = new THREE_INSTANCE.Vector3();
            const camWorldPos = new THREE_INSTANCE.Vector3();
            const rayDir2 = new THREE_INSTANCE.Vector3();
            const rayDir3 = new THREE_INSTANCE.Vector3();

            // Look Scene Viewer: Suelo de rugosidad a 0.28, pedestal emisivo y desaturación al 12%
            const aplicarAjustesSceneViewer = () => {
              if (!_scene) return;
              _scene.traverse((child) => {
                if (child.isMesh && child.material) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  mats.forEach((mat) => {
                    const isPBR = (mat.type === 'MeshStandardMaterial' || mat.type === 'MeshPhysicalMaterial');
                    if (!isPBR) return;

                    const isMetal = mat.metalness !== undefined && mat.metalness > LIGHTING_CONFIG.metalness_bypass_threshold;
                    if (!isMetal && mat.roughness !== undefined && mat.roughness < LIGHTING_CONFIG.min_material_roughness) {
                      mat.roughness = LIGHTING_CONFIG.min_material_roughness;
                    }

                    if (mat.emissive !== undefined) {
                      const p = activeRatios.pedestal;
                      if (mat.emissive.r < p && mat.emissive.g < p && mat.emissive.b < p) {
                        mat.emissive.setRGB(p, p, p);
                      }
                    }

                    if (mat.color && !mat._desaturated) {
                      const hsl = { h: 0, s: 0, l: 0 };
                      mat.color.getHSL(hsl);
                      hsl.s = Math.max(0.0, hsl.s * (1.0 - LIGHTING_CONFIG.albedo_desaturation));
                      mat.color.setHSL(hsl.h, hsl.s, hsl.l);
                      mat._desaturated = true;
                    }
                  });
                }
              });
            };

            const lumaBins = new Int32Array(16);

            // BUCLE MAESTRO TEMPORIZADO (ISO a 300 ms / PMREM GPU a 200 ms - v3.37)
            setInterval(() => {
              try {
                if (!video || video.readyState < 2 || !pmremGenerator) return;
                const now = performance.now();

                // =========================================================================
                // 1. ESCANEO ISO Y ESTIMACIÓN DE LUZ LIMPIA (Cada 300 ms)
                // =========================================================================
                if (now - lastScanTime >= LIGHTING_CONFIG.scan_interval_ms) {
                  lastScanTime = now;

                  // Dibujo 100% limpio y opaco (sin alpha corruption)
                  pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);
                  const imgData = pmremCtx.getImageData(0, 0, pmremSize, pmremSize);
                  const data = imgData.data;

                  let sumR = 0, sumG = 0, sumB = 0;
                  let maxLum = 0;
                  let count = 0;

                  // Captura Frame 1
                  const colorBins = new Int32Array(8);
                  const colorBinLumSumX = new Float32Array(8);
                  const colorBinLumSumY = new Float32Array(8);
                  const colorBinWeight = new Float32Array(8);

                  const scanUpperLimitY = Math.floor(pmremSize * LIGHTING_CONFIG.upper_third_limit);
                  let upperSumX = 0, upperSumY = 0, upperCount = 0;
                  let upperMaxLum = 0;

                  lumaBins.fill(0);

                  for (let idx = 0; idx < data.length; idx += LIGHTING_CONFIG.scan_pixel_step) {
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);

                    const pixelIdx = idx / 4;
                    const px = pixelIdx % pmremSize;
                    const py = Math.floor(pixelIdx / pmremSize);

                    sumR += r;
                    sumG += g;
                    sumB += b;
                    count++;

                    const binIdx = Math.min(15, Math.floor((lum / 256) * 16));
                    lumaBins[binIdx]++;

                    if (lum > maxLum) maxLum = lum;

                    if (!initialLightsPlaced) {
                      // Luz 2 (Gradiente mesa - mayoría v3.37)
                      const cBin = ((r > 100 ? 1 : 0) << 2) | ((g > 100 ? 1 : 0) << 1) | (b > 100 ? 1 : 0);
                      colorBins[cBin]++;
                      colorBinLumSumX[cBin] += px * lum;
                      colorBinLumSumY[cBin] += py * lum;
                      colorBinWeight[cBin] += lum;

                      // Luz 3 (Puntos más claros tercio superior v3.37)
                      if (py < scanUpperLimitY) {
                        const weight = lum * lum;
                        upperSumX += px * weight;
                        upperSumY += py * weight;
                        upperCount += weight;
                        if (lum > upperMaxLum) upperMaxLum = lum;
                      }
                    }
                  }

                  const avgR = count > 0 ? sumR / count : 0;
                  const avgG = count > 0 ? sumG / count : 0;
                  const avgB = count > 0 ? sumB / count : 0;
                  const avgLum = (avgR * 0.299 + avgG * 0.587 + avgB * 0.114);

                  // Extracción Percentil P90 v3.37 limpia
                  let p90Lum = avgLum;
                  let accumulated = 0;
                  const p90Target = count * 0.90;
                  for (let b = 0; b < 16; b++) {
                    accumulated += lumaBins[b];
                    if (accumulated >= p90Target) {
                      p90Lum = ((b + 0.5) / 16) * 255;
                      break;
                    }
                  }

                  const effectiveIlluminance = (avgLum * LIGHTING_CONFIG.avg_weight) + (p90Lum * LIGHTING_CONFIG.p90_weight);

                  // =========================================================================
                  // FRAME 1: DETECCIÓN PERFIL REAL Y POSICIONAMIENTO GEOMÉTRICO (v3.37)
                  // =========================================================================
                  if (!initialLightsPlaced && _activeCamera) {
                    // Umbral calibrado de oscuridad real: solo entra en Noche si avgLum < 30
                    if (savedMode === "AUTO") {
                      currentProfile = (avgLum < 30) ? "NIGHT" : "DAY";
                    } else {
                      currentProfile = savedMode;
                    }

                    if (currentProfile === "NIGHT") {
                      activeRatios.l2 = LIGHTING_CONFIG.night_light2_ratio;
                      activeRatios.l3 = LIGHTING_CONFIG.night_light3_ratio;
                      activeRatios.l4 = LIGHTING_CONFIG.night_light4_ratio;
                      activeRatios.expScale = LIGHTING_CONFIG.night_exposure_scale;
                      activeRatios.pedestal = LIGHTING_CONFIG.night_pedestal;
                    } else {
                      activeRatios.l2 = LIGHTING_CONFIG.day_light2_ratio;
                      activeRatios.l3 = LIGHTING_CONFIG.day_light3_ratio;
                      activeRatios.l4 = LIGHTING_CONFIG.day_light4_ratio;
                      activeRatios.expScale = LIGHTING_CONFIG.day_exposure_scale;
                      activeRatios.pedestal = LIGHTING_CONFIG.day_pedestal;
                    }

                    actualizarIndicadorModo();
                    smoothedBrightness = effectiveIlluminance;

                    _activeCamera.getWorldPosition(camWorldPos);
                    const r = LIGHTING_CONFIG.light_distance;

                    // 1. Luces 2 y 4 a 40º de elevación
                    const elevAngle2_4 = LIGHTING_CONFIG.elevation_angle_light2_4;
                    const initY2_4 = Math.max(LIGHTING_CONFIG.min_light_height, Math.sin(elevAngle2_4) * r);
                    const initXZ2_4 = Math.cos(elevAngle2_4) * r;

                    // 2. Luz 3 a 30º de elevación
                    const elevAngle3 = LIGHTING_CONFIG.elevation_angle_light3;
                    const initY3 = Math.max(LIGHTING_CONFIG.min_light_height, Math.sin(elevAngle3) * r);
                    const initXZ3 = Math.cos(elevAngle3) * r;

                    // Posicionamiento de Luz 2
                    let targetX2 = pmremSize * 0.5;
                    let targetY2 = pmremSize * 0.4;
                    let dominantBin = 0, maxBinCount = 0;
                    for (let c = 0; c < 8; c++) {
                      if (colorBins[c] > maxBinCount) {
                        maxBinCount = colorBins[c];
                        dominantBin = c;
                      }
                    }
                    if (maxBinCount > (count * 0.20) && colorBinWeight[dominantBin] > 0) {
                      targetX2 = colorBinLumSumX[dominantBin] / colorBinWeight[dominantBin];
                      targetY2 = colorBinLumSumY[dominantBin] / colorBinWeight[dominantBin];
                    }

                    const ndcX2 = (targetX2 / pmremSize) * 2 - 1;
                    const ndcY2 = 1 - (targetY2 / pmremSize) * 2;
                    probeNDC.set(ndcX2, ndcY2, 0.5);
                    probeNDC.unproject(_activeCamera);
                    rayDir2.subVectors(probeNDC, camWorldPos).normalize();

                    const azimLen2 = Math.hypot(rayDir2.x, rayDir2.z) || 1.0;
                    const posX2 = (rayDir2.x / azimLen2) * initXZ2_4;
                    const posZ2 = (rayDir2.z / azimLen2) * initXZ2_4;

                    if (slotLight2.light) {
                      slotLight2.light.position.set(posX2, initY2_4, posZ2);
                      slotLight2.anchoredDir.copy(slotLight2.light.position).normalize();
                    }

                    // Posicionamiento de Luz 4 (Posición espejo opuesta a 40º)
                    if (slotLight4.light) {
                      slotLight4.light.position.set(-posX2, initY2_4, -posZ2);
                      slotLight4.anchoredDir.copy(slotLight4.light.position).normalize();
                    }

                    // Posicionamiento de Luz 3 (a 30º con cono de exclusión de 35º)
                    let targetX3 = pmremSize * 0.65;
                    let targetY3 = pmremSize * 0.20;
                    if (upperCount > 0) {
                      targetX3 = upperSumX / upperCount;
                      targetY3 = upperSumY / upperCount;
                    }

                    const ndcX3 = (targetX3 / pmremSize) * 2 - 1;
                    const ndcY3 = 1 - (targetY3 / pmremSize) * 2;
                    probeNDC.set(ndcX3, ndcY3, 0.5);
                    probeNDC.unproject(_activeCamera);
                    rayDir3.subVectors(probeNDC, camWorldPos).normalize();

                    const v2Flat = new THREE_INSTANCE.Vector3(rayDir2.x, 0, rayDir2.z).normalize();
                    const v3Flat = new THREE_INSTANCE.Vector3(rayDir3.x, 0, rayDir3.z).normalize();
                    if (v3Flat.angleTo(v2Flat) < LIGHTING_CONFIG.min_separation_angle) {
                      rayDir3.applyAxisAngle(new THREE_INSTANCE.Vector3(0, 1, 0), LIGHTING_CONFIG.min_separation_angle);
                    } else {
                      const v4Flat = v2Flat.clone().negate();
                      if (v3Flat.angleTo(v4Flat) < LIGHTING_CONFIG.min_separation_angle) {
                        rayDir3.applyAxisAngle(new THREE_INSTANCE.Vector3(0, 1, 0), LIGHTING_CONFIG.min_separation_angle);
                      }
                    }

                    const azimLen3 = Math.hypot(rayDir3.x, rayDir3.z) || 1.0;
                    const posX3 = (rayDir3.x / azimLen3) * initXZ3;
                    const posZ3 = (rayDir3.z / azimLen3) * initXZ3;

                    if (slotLight3.light) {
                      slotLight3.light.position.set(posX3, initY3, posZ3);
                      slotLight3.anchoredDir.copy(slotLight3.light.position).normalize();
                    }

                    initialLightsPlaced = true; // Fijado geométrico definitivo
                    actualizarContadorLuces();
                  }

                  // Suavizado continuo de luminancia v3.37
                  smoothedBrightness += (effectiveIlluminance - smoothedBrightness) * LIGHTING_CONFIG.reaction_speed;
                  const normalizedBrightness = Math.max(0.0, Math.min(1.0, smoothedBrightness / 255));

                  let boostFactor = 1.0;
                  if (maxLum > LIGHTING_CONFIG.boost_lum_threshold) {
                    const boostRatio = (maxLum - LIGHTING_CONFIG.boost_lum_threshold) / (255 - LIGHTING_CONFIG.boost_lum_threshold);
                    boostFactor = 1.0 + boostRatio * (LIGHTING_CONFIG.boost_multiplier - 1.0);
                  }

                  const baseDirectIntensity = normalizedBrightness * LIGHTING_CONFIG.light_maxIntensity * boostFactor;
                  slotLight2.targetIntensity = baseDirectIntensity * activeRatios.l2;
                  slotLight3.targetIntensity = baseDirectIntensity * activeRatios.l3;
                  slotLight4.targetIntensity = baseDirectIntensity * activeRatios.l4;

                  // Actualización continua directa sin atenuación de ángulo
                  if (initialLightsPlaced) {
                    if (slotLight2.light) slotLight2.light.intensity = slotLight2.targetIntensity;
                    if (slotLight3.light) slotLight3.light.intensity = slotLight3.targetIntensity;
                    if (slotLight4.light) slotLight4.light.intensity = slotLight4.targetIntensity;
                  }

                  targetExposure = normalizedBrightness * LIGHTING_CONFIG.exposure_mult * activeRatios.expScale;
                }

                // =========================================================================
                // 2. ACTUALIZACIÓN PMREM GPU RÁPIDA A 128x128 (Cada 200 ms - v3.37)
                // =========================================================================
                if (now - lastPmremTime >= LIGHTING_CONFIG.pmrem_interval_ms) {
                  lastPmremTime = now;

                  envTexture.needsUpdate = true;
                  const oldRT = cameraRT;
                  cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                  if (envMode === 'cam') scene.environment = cameraRT.texture;
                  if (oldRT) oldRT.dispose();
                }

                // Exposición adaptativa continua v3.37
                renderer.toneMappingExposure += (targetExposure - renderer.toneMappingExposure) * LIGHTING_CONFIG.reaction_speed;

                // Calibración Scene Viewer
                aplicarAjustesSceneViewer();

              } catch (e) {}
            }, 50);

          }
        }, 500);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];

          if (obj.name === 'Directional Light') {
            if (obj.light) {
              obj.light.intensity = LIGHTING_CONFIG.light1_intensity;
            }
          }

          if (obj.name === 'Model') {
            obj.scale = [1.01, 1.01, 1.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) {
        log('Error: _scene sigue siendo null');
        return;
      }
      
      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) {
          _scene.environment = originalEnv;
          envMode = 'hdr';
          if (btn) btn.innerText = 'Env: HDR';
        } else {
          if (cameraRT) {
            _scene.environment = cameraRT.texture;
            envMode = 'cam';
            if (btn) btn.innerText = 'Env: CAM';
          } else {
            _scene.environment = null;
            envMode = 'off';
            if (btn) btn.innerText = 'Env: OFF';
          }
        }
      }
    };
  </script>
