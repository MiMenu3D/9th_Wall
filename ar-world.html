<!-- 9th Wall v2.71 -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v2.70<br>
      bundle: v2.70
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Env: CAM
  </button>

  <button id="debugToggle"
    style="position:fixed;bottom:20px;left:130px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Debug: OFF
  </button>

  <script>
    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);
    
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'cam'; // Iniciamos por defecto en CAM ya que el HDR está inactivo para optimizar
    let envInterval = null;
    let _scene = null, _renderer = null;

    // === ESTADO Y VARIABLES GLOBALES (v2.70) ===
    let lightLocked = false;               // Cierra el candado de posición una vez fijado sobre el modelo
    let secondLightShadowOpacity = 0.2;    // Configurado dinámicamente desde el JSON de bundle-world

    document.getElementById('envToggle').addEventListener('click', (e) => {
      log('Button clicked');
      toggleEnv();
    });

    // Control de persistencia y lógica del botón Debug
    const isDebugActive = sessionStorage.getItem("debug_features") === "true";
    const debugToggleBtn = document.getElementById('debugToggle');
    if (debugToggleBtn) {
      debugToggleBtn.innerText = isDebugActive ? "Debug: ON" : "Debug: OFF";
      debugToggleBtn.style.borderColor = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.style.color = isDebugActive ? "#0f0" : "white";
      
      debugToggleBtn.addEventListener('click', () => {
        sessionStorage.setItem("debug_features", isDebugActive ? "false" : "true");
        window.location.reload();
      });
    }

    // === Acoplamiento sobre el THREE Nativo del motor ===
    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              
              // Buscamos el THREE nativo expuesto globalmente por el runtime de 8th Wall
              const nativeTHREE = window.THREE;
              log('Captura exitosa. Usando Three nativo: ' + (!!nativeTHREE));
              
              if (nativeTHREE) {
                // === ACTIVACIÓN SEGURA DEL TONE MAPPING ===
                _renderer.toneMapping = nativeTHREE.ACESFilmicToneMapping;

                // === FORZAR RESOLUCIÓN Y FRUSTUM DE SOMBRAS NATIVAS (Único punto de control de sombras) ===
                _scene.traverse((node) => {
                  if (node.isDirectionalLight) {
                    log('Luz direccional localizada (' + node.name + '). Inicializando sombra...');
                    if (node.shadow) {
                      node.shadow.mapSize.width = 512;
                      node.shadow.mapSize.height = 512;
                      if (node.shadow.camera) {
                        node.shadow.camera.left = -0.35;
                        node.shadow.camera.right = 0.35;
                        node.shadow.camera.top = 0.35;
                        node.shadow.camera.bottom = -0.35;
                        node.shadow.camera.near = 0.1;
                        // Para la luz 2 inclinada que se proyecta lejana, ampliamos el far a 4.0
                        node.shadow.camera.far = (node.name === "Directional Light 2") ? 4.0 : 2.0;
                        node.shadow.camera.updateProjectionMatrix();
                      }
                      // Desechamos el mapa de sombras anterior para que Three.js lo regenere con la nueva resolución
                      if (node.shadow.map) {
                        node.shadow.map.dispose();
                        node.shadow.map = null;
                      }

                      // === APLICAR OPACIDAD PERSONALIZADA INDIVIDUAL (AO SUTIL) ===
                      if (node.name === "Directional Light 2") {
                        node.shadow.intensity = secondLightShadowOpacity;
                        log('Opacidad de sombra aplicada a Luz 2: ' + secondLightShadowOpacity);
                      }
                    }
                  }
                });

                // Descargamos y registramos RGBELoader directamente en el THREE nativo
                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  } else {
                    log('Error: No se pudo instanciar el cargador.');
                  }
                });
              } else {
                log('Error: window.THREE nativo no encontrado.');
              }

            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    // Descarga dinámica de RGBELoader sobre la instancia nativa del motor
    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        
        log('Descargando RGBELoader...');
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            // Evaluamos el código del loader forzando el ámbito del THREE nativo de 8th Wall
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            log('RGBELoader acoplado al Three nativo con éxito.');
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => {
            log('Error al descargar RGBELoader: ' + err.message);
            resolve(null);
          });
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        // Inicializamos PMREM usando la clase nativa del motor de 8th Wall
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        log('PMREM compilado en motor nativo');

        // === CONTROL DE CARGA DEL HDR (Configuración manual) ===
        const LOAD_HDR = false; // Cambiar a true para reactivar la descarga y uso del entorno HDR
        
        if (LOAD_HDR) {
          log('Cargando textura de entorno HDR...');
          new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
            log('HDR cargado');
            hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            originalEnv = hdr;
            if (envMode === 'hdr') scene.environment = hdr;
          }, undefined, (err) => {
            log('Error cargando HDR: ' + err.message);
          });
        } else {
          log('HDR desactivado (LOAD_HDR = false)');
        }

        // Separamos la estimación de luz del PMREM para reducir el trabajo de GPU.
        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);
            log('Vídeo listo para estimación');

            // Refresco del Light Estimation: brillo medio para la exposición.
            const lightEstimationSize = 16;
            const lightEstimationInterval = 50;
            const lightCanvas = document.createElement('canvas');
            lightCanvas.width = lightEstimationSize;
            lightCanvas.height = lightEstimationSize;
            const lightCtx = lightCanvas.getContext('2d');

            // Configuración del PMREM: reflejos de los materiales desde la cámara.
            const pmremSize = 64;
            const pmremInterval = 200;
            const pmremCanvas = document.createElement('canvas');
            pmremCanvas.width = pmremSize;
            pmremCanvas.height = pmremSize;
            const envTexture = new THREE_INSTANCE.CanvasTexture(pmremCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            const pmremCtx = pmremCanvas.getContext('2d');
            let smoothed = 120;

            // Refresco del Light Estimation: lectura ligera del brillo de la cámara.
            envInterval = setInterval(() => {
              try {
                if (!video || video.readyState < 2) return;
                lightCtx.drawImage(video, 0, 0, lightEstimationSize, lightEstimationSize);
                const pixels = lightCtx.getImageData(0, 0, lightEstimationSize, lightEstimationSize).data;
                let total = 0;
                let maxBrightness = -1;
                let brightX = 0;
                let brightY = 0;

                // Analizamos los píxeles del Light Estimation para localizar la zona de iluminación máxima
                for (let y = 0; y < lightEstimationSize; y++) {
                  for (let x = 0; x < lightEstimationSize; x++) {
                    const idx = (y * lightEstimationSize + x) * 4;
                    const r = pixels[idx];
                    const g = pixels[idx + 1];
                    const b = pixels[idx + 2];
                    const val = 0.299 * r + 0.587 * g + 0.114 * b; // Luminancia relativa
                    total += val;
                    if (val > maxBrightness) {
                      maxBrightness = val;
                      brightX = x;
                      brightY = y;
                    }
                  }
                }

                const brightness = total / (pixels.length / 4);
                smoothed += (brightness - smoothed) * 0.08;

                // LUZ PMREM LIGHT Ajuste de exposición basado en brillo promedio.
                renderer.toneMappingExposure = 0.6 + (smoothed / 255) * 1.5; // ORI 1.9, sin segunda luz aún

                // === LOGICA DE CONTROL DE LA SEGUNDA LUZ (v2.70) ===
                let secondLight = null;
                let modelNode = null;
                let activeCam = null;

                if (_scene) {
                  _scene.traverse((node) => {
                    if (node.isDirectionalLight && node.name === "Directional Light 2") {
                      secondLight = node;
                    }
                    if (node.name === "Model") {
                      modelNode = node;
                    }
                    if (node.isCamera) {
                      activeCam = node;
                    }
                  });
                }

                if (secondLight) {
                  // A. ASOCIACIÓN DE LUMINANCIA-LUZ LIGADA AL ESTIMATION PERO SUAVIZADA (Light Estimation ORI * 0.5)
                  secondLight.intensity = (smoothed / 255) * 0.25;

                  // B. COLOCACIÓN ESPACIAL EN EL PUNTO MÁS BRILLANTE (FIJA UNA VEZ COLOCADO EL MODELO)
                  if (modelNode && activeCam && !lightLocked) {
                    const nativeTHREE = window.THREE;
                    if (nativeTHREE) {
                      // Coordenadas Normalizadas de Dispositivo (NDC) del píxel más brillante
                      const ndcX = (brightX / (lightEstimationSize - 1)) * 2 - 1;
                      const ndcY = 1 - (brightY / (lightEstimationSize - 1)) * 2; // Invertimos Y para NDC

                      // Desproyectamos el vector 2D de la pantalla en una dirección 3D del espacio de la cámara
                      const vector = new nativeTHREE.Vector3(ndcX, ndcY, 0.5);
                      vector.unproject(activeCam);
                      const dir = vector.sub(activeCam.position).normalize();

                      // Obtenemos la posición del modelo en el espacio 3D
                      const modelPos = new nativeTHREE.Vector3();
                      modelNode.getWorldPosition(modelPos);

                      // Proyectamos la luz a 1.5 metros del modelo en esa dirección
                      const lightPos = new nativeTHREE.Vector3()
                        .copy(modelPos)
                        .addScaledVector(dir, 1.5);

                      // Límite de seguridad: altura mínima del Ground de 30cm (eje vertical y)
                      if (lightPos.y < 0.3) {
                        lightPos.y = 0.3;
                      }

                      // Fijamos la posición en el espacio 3D de la luz
                      secondLight.position.copy(lightPos);
                      secondLight.updateMatrixWorld();
                      
                      // Cerramos el candado: se mantendrá fija independientemente del movimiento de la cámara
                      lightLocked = true;
                      log("Luz 2 fijada en: " + lightPos.x.toFixed(2) + ", " + lightPos.y.toFixed(2) + ", " + lightPos.z.toFixed(2));
                    }
                  } else if (!modelNode) {
                    // Si el modelo es eliminado (Reset), abrimos el candado para que vuelva a calcular en la siguiente colocación
                    lightLocked = false;
                  }
                }

              } catch (e) {
                // Silencioso
              }
            }, lightEstimationInterval);

            // Refresco del PMREM: actualización de reflejos menos frecuente.
            setInterval(() => {
              try {
                if (!video || video.readyState < 2 || !pmremGenerator) return;
                pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);
                envTexture.needsUpdate = true;

                const oldRT = cameraRT;
                cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                if (envMode === 'cam') scene.environment = cameraRT.texture;
                if (oldRT) oldRT.dispose();
              } catch (e) {
                // Silencioso
              }
            }, pmremInterval);
          }
        }, 500);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    // Interceptor de la inicialización de ECS (Mantiene la estructura original estable)
    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];
          
          // === COMPORTAMIENTO INTERRUPTOR DE EXISTENCIA SEGUNDA LUZ (v2.70) ===
          if (obj.name === 'Directional Light 2') {
            if (obj.light) {
              // Si está inactiva en el JSON, la borramos completamente del ECS
              if (obj.light.active === false) {
                delete c.objects[k];
                continue;
              }
              // Si está activa, leemos el valor de la intensidad de la sombra para aplicarlo después en Three
              if (obj.light.shadowOpacity !== undefined) {
                secondLightShadowOpacity = obj.light.shadowOpacity;
              }
            }
          }

          // Solución a la doble iluminación nativa:
          if (obj.name === 'Directional Light') {
            if (obj.light) {
              obj.light.intensity = 0.00; // Atenuamos la luz direccional principal para conservar sombras suaves
            }
          }

          if (obj.name === 'Model') {
            obj.scale = [1.01, 1.01, 1.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) {
        log('Error: _scene sigue siendo null');
        return;
      }
      
      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) {
          _scene.environment = originalEnv;
          envMode = 'hdr';
          if (btn) btn.innerText = 'Env: HDR';
        } else {
          // Si el HDR está inactivo, saltamos directamente a CAM (si está listo) o a OFF
          if (cameraRT) {
            _scene.environment = cameraRT.texture;
            envMode = 'cam';
            if (btn) btn.innerText = 'Env: CAM';
          } else {
            _scene.environment = null;
            envMode = 'off';
            if (btn) btn.innerText = 'Env: OFF';
          }
        }
      }

      log('Entorno cambiado a: ' + envMode.toUpperCase());
    };
  </script>

  <script src="bundle-world.js"></script>
</body>
</html>
