<!-- 9th Wall v1.11 -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
  <script src="https://unpkg.com/three@0.139.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js"></script>
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:10px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">v1.11 (Tap to toggle)</div>
    <div id="debugContent">
      ar-world: v1.11<br>
      bundle: v1.06<br>
      Status: Waiting...
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 12px; width: 70px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Env: HDR
  </button>

  <script>
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    // === PMREM + Light Estimation ===
    // Injects environment reflections and adaptive exposure into the 8th Wall ECS scene.
    // Uses XR8.Threejs.xrScene() to access the underlying Three.js renderer and scene.

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'hdr', envInterval = null;
    let _scene = null, _renderer = null;

    document.getElementById('envToggle').addEventListener('click', (e) => {
      log('Button clicked');
      toggleEnv();
    });

    function installPMREM() {
      XR8.addCameraPipelineModule({
        name: 'pmrem-light-estimator',
              onStart: () => {
          log('PMREM Module: onStart (v1.10)');
          const checkScene = setInterval(() => {
            const xrScene = XR8.Threejs.xrScene();
            if (xrScene && xrScene.scene && xrScene.renderer) {
              _scene    = xrScene.scene;
              _renderer = xrScene.renderer;
              log('Scene Captured! (v1.10)');
              clearInterval(checkScene); // Detenemos el intervalo una vez la escena está lista

              // --- AHORA QUE LA ESCENA ESTÁ CAPTURADA, INICIALIZAMOS PMREM Y HDR ---
              _renderer.toneMapping = THREE.ACESFilmicToneMapping; // Configuración inicial del renderizador
              _renderer.toneMappingExposure = 1;
              _renderer.outputEncoding = THREE.sRGBEncoding;
              log('Renderer configured for HDR');

              pmremGenerator = new THREE.PMREMGenerator(_renderer);
              pmremGenerator.compileEquirectangularShader();
              log('PMREM Generator ready');

              // Baseline HDR environment
              log('Loading HDR image...');
              new THREE.RGBELoader().load('../HDR/terrace_sea.hdr', (hdr) => {
                log('HDR Image Loaded');
                hdr.mapping = THREE.EquirectangularReflectionMapping;
                originalEnv = hdr;
                if (envMode === 'hdr') _scene.environment = hdr;
                log('HDR environment applied to scene');
              }, undefined, (err) => log('HDR Error loading: ' + err)); // Mensaje de error si falla la carga HDR

              // Light Estimation: sample camera video every 50ms
              const waitForVideo = setInterval(() => {
                const video = document.querySelector('video');
                if (video && video.readyState >= 2) {
                  clearInterval(waitForVideo);
                  log('Video stream ready for Light Estimation');

                  const envCanvas  = document.createElement('canvas');
                  envCanvas.width  = 64;
                  envCanvas.height = 64;
                  const envTexture = new THREE.CanvasTexture(envCanvas);
                  envTexture.mapping = THREE.EquirectangularReflectionMapping;
                  const ctx = envCanvas.getContext('2d');
                  let smoothed = 120;

                  envInterval = setInterval(() => {
                    if (!video || video.readyState < 2) return;
                    ctx.drawImage(video, 0, 0, 64, 64);
                    envTexture.needsUpdate = true;

                    if (pmremGenerator) {
                      if (cameraRT) cameraRT.dispose();
                      cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                      if (envMode === 'cam') _scene.environment = cameraRT.texture;
                    }

                    // Brightness → adaptive exposure
                    const pixels = ctx.getImageData(0, 0, 64, 64).data;
                    let total = 0;
                    for (let i = 0; i < pixels.length; i += 4) {
                      total += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                    }
                    const brightness = total / (pixels.length / 4);
                    smoothed += (brightness - smoothed) * 0.08;
                    _renderer.exposure = 0.6 + (smoothed / 255) * 0.9;
                  }, 50);
                }
              }, 500);
            } else {
              // log('Waiting for Scene...'); // Debug opcional si la escena tarda
            }
          }, 100); // Chequear cada 100ms
        }
  </script>

  <script src="bundle-world.js"></script>
</body>
</html>
