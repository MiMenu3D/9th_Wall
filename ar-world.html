<!-- 9th Wall v2.15 -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <!-- 8th Wall ECS runtime -->
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <!-- 8th Wall XR — SLAM World Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <!-- 8th Wall landing page (splash screen) -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- Three.js — needed for PMREM + Light Estimation -->
</head>
<body>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.2;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v2.15<br>
      bundle: v2.14
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:12px 16px;border-radius:12px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:14px;pointer-events:auto !important;">
    Env: HDR
  </button>

  <script>
    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);
    
    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'hdr', envInterval = null;
    let _scene = null, _renderer = null;

    // === GESTIÓN DE LA NUBE DE PUNTOS (DIAGNÓSTICO) ===
    let pointCloudMesh = null;
    const maxPoints = 1000; // Límite de puntos a dibujar en pantalla simultáneamente
    const positionsArray = new Float32Array(maxPoints * 3);

    // Inicializa el sistema de partículas de Three.js para pintar los puntos en 3D
    function initPointCloud(scene, THREE_INSTANCE) {
      const geometry = new THREE_INSTANCE.BufferGeometry();
      geometry.setAttribute('position', new THREE_INSTANCE.BufferAttribute(positionsArray, 3));
      
      const material = new THREE_INSTANCE.PointsMaterial({
        color: 0xffcc00,       // Amarillo/Dorado oficial para mejor visibilidad
        size: 0.04,            // Tamaño de los puntos (4cm aprox)
        sizeAttenuation: true, // Los puntos se encogen si te alejas
        transparent: true,
        opacity: 0.9
      });
      
      pointCloudMesh = new THREE_INSTANCE.Points(geometry, material);
      scene.add(pointCloudMesh);
      log('Nube de puntos 3D inicializada');
    }

    // Actualiza la posición de los puntos en tiempo real con los datos de 8th Wall
    function updatePointCloud(worldPoints) {
      if (!pointCloudMesh || !worldPoints) return;
      
      const positions = pointCloudMesh.geometry.attributes.position.array;
      const count = Math.min(worldPoints.length, maxPoints);
      
      for (let i = 0; i < count; i++) {
        const pt = worldPoints[i].position;
        positions[i * 3] = pt.x;
        positions[i * 3 + 1] = pt.y;
        positions[i * 3 + 2] = pt.z;
      }
      
      // Indicamos a Three.js cuántos puntos dibujar y que debe actualizar sus posiciones
      pointCloudMesh.geometry.setDrawRange(0, count);
      pointCloudMesh.geometry.attributes.position.needsUpdate = true;
    }

    // Módulo de cámara de 8th Wall para extraer las coordenadas del SLAM en cada cuadro
    const pointCloudPipelineModule = () => {
      return {
        name: 'pointcloud-debugger',
        onUpdate: (e) => {
          const { processCpuResult } = e;
          if (processCpuResult && processCpuResult.reality) {
            const { worldPoints } = processCpuResult.reality;
            if (worldPoints) {
              updatePointCloud(worldPoints);
            }
          }
        }
      };
    };

    // Añadir el extractor de puntos al motor de realidad aumentada
    const addPointCloudPipeline = () => {
      const onxrloaded = () => {
        window.XR8.addCameraPipelineModule(pointCloudPipelineModule());
      };
      if (window.XR8) {
        onxrloaded();
      } else {
        window.addEventListener('xrloaded', onxrloaded);
      }
    };
    addPointCloudPipeline();

    // === GESTIÓN DE PRUEBAS VISUALES DE SUELO Y CÁMARA DE SOMBRAS ===
    function ejecutarPruebasVisuales(scene, THREE_INSTANCE) {
      setTimeout(() => {
        log('Buscando suelo y luces para diagnósticos...');

        scene.traverse((node) => {
          // PRUEBA 1: Buscar el suelo (Ground) y pintarlo de rojo semitransparente
          if (node.isMesh && (node.name.toLowerCase().includes('ground') || node.name.toLowerCase().includes('suelo'))) {
            node.material = new THREE_INSTANCE.MeshBasicMaterial({
              color: 0xff0000,
              transparent: true,
              opacity: 0.4,
              side: THREE_INSTANCE.DoubleSide
            });
            log('Suelo detectado y pintado de rojo');
          }

          // PRUEBA 2: Buscar la luz direccional y dibujar su área matemática de sombras
          if (node.isDirectionalLight) {
            const helper = new THREE_INSTANCE.CameraHelper(node.shadow.camera);
            scene.add(helper);
            log('Caja de sombras (CameraHelper) activada');
          }
        });
      }, 3000); // 3 segundos para asegurar la correcta instanciación
    }

    document.getElementById('envToggle').addEventListener('click', (e) => {
      log('Button clicked');
      toggleEnv();
    });

    // === ESTRATEGIA 03: Acoplamiento sobre el THREE Nativo del motor ===
    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              
              const nativeTHREE = window.THREE;
              log('Captura exitosa. Usando Three nativo: ' + (!!nativeTHREE));
              
              if (nativeTHREE) {
                // Inicializamos la nube de puntos vacía en la escena
                initPointCloud(_scene, nativeTHREE);

                // Descargamos y registramos RGBELoader directamente en el THREE nativo
                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  } else {
                    log('Error: No se pudo instanciar el cargador.');
                  }
                });
              } else {
                log('Error: window.THREE nativo no encontrado.');
              }

            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    // Descarga dinámica de RGBELoader sobre la instancia nativa del motor
    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        
        log('Descargando RGBELoader...');
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            log('RGBELoader acoplado al Three nativo con éxito.');
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => {
            log('Error al descargar RGBELoader: ' + err.message);
            resolve(null);
          });
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        // Inicializamos PMREM usando la clase nativa del motor de 8th Wall
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        log('PMREM compilado en motor nativo');

        // Carga de textura de entorno HDR
        new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
          log('HDR cargado');
          hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
          originalEnv = hdr;
          if (envMode === 'hdr') scene.environment = hdr;
        }, undefined, (err) => {
          log('Error cargando HDR: ' + err.message);
        });

        // Bucle para estimación de luz
        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);
            log('Vídeo listo para estimación');

            const envCanvas = document.createElement('canvas');
            envCanvas.width = 64;
            envCanvas.height = 64;
            const envTexture = new THREE_INSTANCE.CanvasTexture(envCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            const ctx = envCanvas.getContext('2d');
            let smoothed = 120;

            envInterval = setInterval(() => {
              try {
                if (!video || video.readyState < 2) return;
                ctx.drawImage(video, 0, 0, 64, 64);
                envTexture.needsUpdate = true;

                if (pmremGenerator) {
                  const oldRT = cameraRT;
                  cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                  if (envMode === 'cam') scene.environment = cameraRT.texture;
                  if (oldRT) oldRT.dispose(); 
                }

                // Estimación de exposición
                const pixels = ctx.getImageData(0, 0, 64, 64).data;
                let total = 0;
                for (let i = 0; i < pixels.length; i += 4) {
                  total += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                }
                const brightness = total / (pixels.length / 4);
                smoothed += (brightness - smoothed) * 0.08;
                renderer.exposure = 0.4 + (smoothed / 255) * 1.5;
              } catch (e) {
                // Silencioso
              }
            }, 50);
          }
        }, 500);

        // Activamos las pruebas visuales (Suelo rojo y Caja de sombras)
        ejecutarPruebasVisuales(scene, THREE_INSTANCE);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    // Interceptor de la inicialización de ECS
    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];
          
          if (obj.name === 'Ambient Light') {
            if (obj.light) {
              obj.light.intensity = 0;
            }
          }
          if (obj.name === 'Directional Light') {
            if (obj.light) {
              obj.light.intensity = 0.00;
            }
          }

          if (obj.name === 'Model') {
            obj.scale = [10.01, 10.01, 10.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) {
        log('Error: _scene sigue siendo null');
        return;
      }
      
      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) _scene.environment = originalEnv;
        envMode = 'hdr';
        if (btn) btn.innerText = 'Env: HDR';
      }

      log('Entorno cambiado a: ' + envMode.toUpperCase());
    };
  </script>

  <script src="bundle-world.js"></script>
</body>
</html>
