<!-- 9th Wall v4.03 Apple Probe -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9th Wall AR</title>
  <script crossorigin="anonymous" src="external/runtime/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="touchBlocker" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:999990;pointer-events:auto;background:transparent;"></div>

  <div id="debugLog" onclick="this.classList.toggle('minimized')"
    style="position:fixed;top:10px;right:10px;z-index:1000000;background:rgba(0,0,0,0.9);color:#0f0;font-family:monospace;font-size:12px;padding:8px;border-radius:4px;cursor:pointer;line-height:1.3;border:1px solid #0f0;">
    <div id="debugTitle">FPS: --</div>
    <div id="debugContent">
      ar-world: v4.03<br>
      bundle: v4.03<br>
      <span id="envVerdictSpan" style="color:#0f0;">Entorno: ESPERANDO MESA...</span><br>
      <span id="telemetrySpan" style="color:#0f0;">P98: -- (/255) | Lum: -- (/255) | Cálido: --%</span><br>
      <span id="lightsCountSpan" style="color:#0f0;">Luces: 1</span><br>
      <span id="latencySpan" style="color:#0f0;">Latencia: -- ms</span>
    </div>
  </div>
  <style>
    #debugLog.minimized { height: 15px; width: 60px; overflow: hidden; border-color: #555; }
    #debugLog.minimized #debugContent { display: none; }
  </style>

  <div id="readyPromptContainer" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999999;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0;transition:opacity 0.5s ease;">
    <div style="background:rgba(0,0,0,0.75);color:white;font-family:sans-serif;font-size:16px;font-weight:bold;padding:10px 22px;border-radius:22px;border:1px solid rgba(255,255,255,0.4);margin-bottom:14px;text-align:center;white-space:nowrap;">
      Apunta hacia la mesa
    </div>
    <button id="readyBtn" style="pointer-events:auto !important;background:#00e5ff;color:#000;border:none;font-family:sans-serif;font-size:16px;font-weight:bold;padding:14px 40px;border-radius:28px;box-shadow:0 4px 20px rgba(0,229,255,0.7);cursor:pointer;letter-spacing:0.5px;">
      Listo
    </button>
  </div>

  <div id="scaleStatusText" style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999995;font-family:sans-serif;font-style:italic;font-size:18px;color:rgba(255,255,255,0.85);text-shadow:0 1px 4px rgba(0,0,0,0.9);pointer-events:none;opacity:0;transition:opacity 0.8s ease;white-space:nowrap;">
    Calculando escala real...
  </div>

  <button id="envToggle"
    style="position:fixed;bottom:20px;left:20px;z-index:1000000;padding:10px 14px;border-radius:10px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:13px;pointer-events:auto !important;">
    Env: CAM
  </button>

  <button id="debugToggle"
    style="position:fixed;bottom:20px;left:120px;z-index:1000000;padding:10px 14px;border-radius:10px;border:1px solid white;background:rgba(0,0,0,0.7);color:white;font-size:13px;pointer-events:auto !important;">
    Debug: OFF
  </button>

  <script>
    const LIGHTING_CONFIG = {
      pmrem_resolution: 64,
      pmrem_interval_ms: 200,
      scan_interval_ms: 300,
      calibration_frames_target: 8,
      shadow_map_size: 512,
      day_shadow_radius: 4.0,
      night_shadow_radius: 8.0,
      ground_opacity_fixed: 0.40,

      day_total_energy: 5.20,
      day_pmrem_mult: 1.50,
      day_pedestal: 0.035,

      night_total_energy: 0.80,
      night_pmrem_mult: 3.20,
      night_pedestal: 0.050,

      weights_1_light: [1.00],
      weights_2_lights: [0.70, 0.30],
      weights_real_focus: [0.50, 0.50],

      master_exposure_scale: 0.45,
      exposure_mult: 1.80,
      transition_duration_ms: 800,
      out_of_frame_retention: 0.80,
      smoothing_rate: 2.2,

      light_distance: 1.2,
      min_light_height: 0.20,
      max_light_radius: 1.2,
      elevation_angle_light2: (40.0 * Math.PI) / 180.0,
      light3_default_pos: [1.3, 0.25, 0.0],
      light4_default_pos: [-1.3, 0.25, 0.0],
      min_separation_angle: 0.52,

      emitter_lum_threshold: 197,
      min_core_pixels: 2,
      contrast_delta_threshold: 72,
      temporal_drop_threshold: 12.7,
      halo_radius_px: 8,
      halo_drop_threshold: 34,
      upper_half_limit: 0.45,
      debounce_cycles: 1,
      min_material_roughness: 0.35,
      metalness_bypass_threshold: 0.50,
      albedo_desaturation: 0.15,
      temporal_blend_alpha: 0.25
    };

    let lastTime = performance.now();
    let frameCount = 0;
    function updateFPS() {
      frameCount++;
      const now = performance.now();
      if (now >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const fpsEl = document.getElementById('debugTitle');
        if (fpsEl) fpsEl.innerText = `FPS: ${fps}`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(updateFPS);
    }
    requestAnimationFrame(updateFPS);

    const log = (msg) => {
      const el = document.getElementById('debugContent');
      if (el) el.innerHTML += `<br>> ${msg}`;
    };

    let pmremGenerator = null, cameraRT = null, originalEnv = null;
    let envMode = 'cam';
    let _scene = null, _renderer = null, _activeCamera = null, _groundMesh = null, _baseLight1 = null;
    let _ecsWorld = null;

    let currentDirectBudget = LIGHTING_CONFIG.day_total_energy;
    let currentPmremMult = LIGHTING_CONFIG.day_pmrem_mult;
    let currentPedestal = LIGHTING_CONFIG.day_pedestal;
    let environmentFactor = 0.0;

    const crearRanuraLuz = () => ({
      light: null,
      isAnchored: false,
      anchoredDir: null,
      anchoredIntensity: 0.0,
      targetIntensity: 0.0,
      state: 'idle',
      transition: {
        startTime: 0,
        duration: 800,
        startIntensity: 0.0,
        destIntensity: 0.0
      }
    });

    const slotLight2 = crearRanuraLuz();
    const slotLight3 = crearRanuraLuz();
    const slotLight4 = crearRanuraLuz();
    const carruselSlots = [slotLight2, slotLight3, slotLight4];

    let previousAvgLum = 128;
    let initialLightPlaced = false;
    let lastFrameTime = performance.now();
    let totalLightsDetected = 1;
    let totalRealLightsAnchored = 0;
    let detectionPermanentlyStopped = false;
    let lightScanPaused = false;

    let isCalibrating = false;
    let isCalibrated = false;
    let isObjectPlaced = false;
    let calibrationFramesDone = 0;
    const accumulatedP98Samples = [];
    const accumulatedAvgLumSamples = [];
    const accumulatedWarmRatioSamples = [];

    const candidateDebounce = {
      active: false,
      screenX: 0,
      screenY: 0,
      consecutiveCycles: 0,
      dir: null
    };

    const actualizarContadorLuces = () => {
      const lightsSpan = document.getElementById('lightsCountSpan');
      if (lightsSpan) lightsSpan.innerText = `Luces: ${totalLightsDetected}`;
    };

    const actualizarHUDTelemetria = (verdict, p98, lum, warmPct) => {
      const envSpan = document.getElementById('envVerdictSpan');
      const telSpan = document.getElementById('telemetrySpan');
      if (envSpan) envSpan.innerText = `Entorno: ${verdict}`;
      if (telSpan) telSpan.innerText = `P98: ${Math.round(p98)} (/255) | Lum: ${Math.round(lum)} (/255) | Cálido: ${Math.round(warmPct)}%`;
    };

    // v4.00: al completarse el asentamiento de escala métrica en bundle-world.js, se oculta el aviso y se reanuda el escaneo de luces
    window.onScaleStabilizationComplete = () => {
      const scaleStatusEl = document.getElementById('scaleStatusText');
      if (scaleStatusEl) scaleStatusEl.style.opacity = '0';
      lightScanPaused = false;
    };

    document.getElementById('envToggle').addEventListener('click', () => toggleEnv());

    const isDebugActive = sessionStorage.getItem("debug_features") === "true";
    const debugToggleBtn = document.getElementById('debugToggle');
    if (debugToggleBtn) {
      debugToggleBtn.innerText = isDebugActive ? "Debug: ON" : "Debug: OFF";
      debugToggleBtn.style.borderColor = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.style.color = isDebugActive ? "#0f0" : "white";
      debugToggleBtn.addEventListener('click', () => {
        sessionStorage.setItem("debug_features", isDebugActive ? "false" : "true");
        window.location.reload();
      });
    }

    if (window.ecs) {
      window.ecs.registerComponent({
        name: 'scene-capturer',
        add: (world, component) => {
          setTimeout(() => {
            try {
              _ecsWorld = world;
              _scene = world.three.scene;
              _renderer = world.three.renderer;
              _activeCamera = world.three.activeCamera;

              const nativeTHREE = window.THREE;

              if (nativeTHREE) {
                _renderer.shadowMap.enabled = true;
                _renderer.toneMapping = nativeTHREE.ACESFilmicToneMapping;
                _renderer.toneMappingExposure = 1.0;

                candidateDebounce.dir = new nativeTHREE.Vector3();

                carruselSlots.forEach(slot => {
                  slot.anchoredDir = new nativeTHREE.Vector3(0, 1, 0);
                });

                _scene.traverse((node) => {
                  if (node.name === 'Hider') node.visible = false;
                  if (node.isMesh && node.material && (node.material.type === 'ShadowMaterial' || node.name === 'Ground')) {
                    _groundMesh = node;
                    if (_groundMesh.material) {
                      _groundMesh.material.opacity = LIGHTING_CONFIG.ground_opacity_fixed;
                    }
                  }
                  if (node.isDirectionalLight) {
                    _baseLight1 = node;
                    node.intensity = 0.0;
                    if (node.shadow) {
                      node.shadow.mapSize.width = LIGHTING_CONFIG.shadow_map_size;
                      node.shadow.radius = LIGHTING_CONFIG.day_shadow_radius;
                      if (node.shadow.camera) {
                        node.shadow.camera.left = -0.50;
                        node.shadow.camera.right = 0.50;
                        node.shadow.camera.top = 0.50;
                        node.shadow.camera.bottom = -0.50;
                        node.shadow.camera.near = 0.1;
                        node.shadow.camera.far = 10;
                        node.shadow.camera.updateProjectionMatrix();
                      }
                      if (node.shadow.map) {
                        node.shadow.map.dispose();
                        node.shadow.map = null;
                      }
                    }
                  }
                });

                slotLight2.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight2.light.position.set(0, 1.41, -1.69);
                _scene.add(slotLight2.light);
                _scene.add(slotLight2.light.target);

                slotLight3.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight3.light.position.set(
                  LIGHTING_CONFIG.light3_default_pos[0],
                  LIGHTING_CONFIG.light3_default_pos[1],
                  LIGHTING_CONFIG.light3_default_pos[2]
                );
                _scene.add(slotLight3.light);
                _scene.add(slotLight3.light.target);

                slotLight4.light = new nativeTHREE.DirectionalLight(0xffffff, 0.0);
                slotLight4.light.position.set(
                  LIGHTING_CONFIG.light4_default_pos[0],
                  LIGHTING_CONFIG.light4_default_pos[1],
                  LIGHTING_CONFIG.light4_default_pos[2]
                );
                _scene.add(slotLight4.light);
                _scene.add(slotLight4.light.target);

                try {
                  if (_renderer && _activeCamera && _scene) {
                    _renderer.compile(_scene, _activeCamera);
                  }
                } catch (e) {}

                loadNativeRGBELoader(nativeTHREE).then((LoaderClass) => {
                  if (LoaderClass) {
                    initPMREMLogic(_scene, _renderer, nativeTHREE, LoaderClass);
                  }
                });
              }
            } catch (err) {
              log('Error al capturar: ' + err.message);
            }
          }, 100);
        }
      });
    }

    function loadNativeRGBELoader(THREE_INSTANCE) {
      return new Promise((resolve) => {
        if (THREE_INSTANCE.RGBELoader) {
          resolve(THREE_INSTANCE.RGBELoader);
          return;
        }
        fetch('https://unpkg.com/three@0.139.2/examples/js/loaders/RGBELoader.js')
          .then(res => res.text())
          .then(code => {
            window.THREE = THREE_INSTANCE;
            (new Function(code))();
            resolve(THREE_INSTANCE.RGBELoader);
          })
          .catch(err => resolve(null));
      });
    }

    function initPMREMLogic(scene, renderer, THREE_INSTANCE, LoaderClass) {
      try {
        pmremGenerator = new THREE_INSTANCE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new LoaderClass().load('HDR/terrace_sea.hdr', (hdr) => {
          hdr.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
          originalEnv = hdr;
          if (envMode === 'hdr') scene.environment = hdr;
        }, undefined, () => {});

        const waitForVideo = setInterval(() => {
          const video = document.querySelector('video');
          if (video && video.readyState >= 2) {
            clearInterval(waitForVideo);

            const readyPrompt = document.getElementById('readyPromptContainer');
            if (readyPrompt) {
              readyPrompt.style.opacity = '1';
              readyPrompt.style.pointerEvents = 'auto';
            }

            const pmremSize = LIGHTING_CONFIG.pmrem_resolution;
            const pmremCanvas = document.createElement('canvas');
            pmremCanvas.width = pmremSize;
            pmremCanvas.height = pmremSize;
            const pmremCtx = pmremCanvas.getContext('2d', { willReadFrequently: true });

            try {
              pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);
              pmremCtx.getImageData(0, 0, pmremSize, pmremSize);
            } catch (e) {}

            const envTexture = new THREE_INSTANCE.CanvasTexture(pmremCanvas);
            envTexture.mapping = THREE_INSTANCE.EquirectangularReflectionMapping;
            if (THREE_INSTANCE.sRGBEncoding) envTexture.encoding = THREE_INSTANCE.sRGBEncoding;

            let smoothedBrightness = 128;
            let targetExposure = 0.45;
            let lastScanTime = 0;
            let lastPmremTime = 0;

            const probeNDC = new THREE_INSTANCE.Vector3();
            const camWorldPos = new THREE_INSTANCE.Vector3();
            const rayDir = new THREE_INSTANCE.Vector3();
            const candidatePos = new THREE_INSTANCE.Vector3();
            const groundPlane = new THREE_INSTANCE.Plane(new THREE_INSTANCE.Vector3(0, 1, 0), 0);
            const placementRay = new THREE_INSTANCE.Ray();

            const aplicarRestriccionesMesa = (outVec, origin, dir, dist) => {
              outVec.copy(origin).addScaledVector(dir, dist);
              if (outVec.length() > LIGHTING_CONFIG.max_light_radius) {
                outVec.setLength(LIGHTING_CONFIG.max_light_radius);
              }
              outVec.y = Math.max(LIGHTING_CONFIG.min_light_height, outVec.y);
            };

            const iniciarTransicionRanura = (slot, destIntensity, duration = 800, newPos = null, newDir = null) => {
              slot.state = (destIntensity > 0) ? 'transitioning' : 'fading_out';
              slot.transition.startTime = performance.now();
              slot.transition.duration = duration;
              slot.transition.startIntensity = slot.light ? slot.light.intensity : 0.0;
              slot.transition.destIntensity = destIntensity;
              slot.targetIntensity = destIntensity;

              if (destIntensity > 0) {
                slot.isAnchored = true;
                slot.anchoredIntensity = destIntensity;
              }
              if (newPos && slot.light) slot.light.position.copy(newPos);
              if (newDir) slot.anchoredDir.copy(newDir);
            };

            const aplicarAjustesSceneViewer = () => {
              if (!_scene) return;
              _scene.traverse((child) => {
                if (child.isMesh && child.material) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  mats.forEach((mat) => {
                    const isPBR = (mat.type === 'MeshStandardMaterial' || mat.type === 'MeshPhysicalMaterial');
                    if (!isPBR) return;

                    const isMetal = mat.metalness !== undefined && mat.metalness > LIGHTING_CONFIG.metalness_bypass_threshold;
                    if (!isMetal && mat.roughness !== undefined && mat.roughness < LIGHTING_CONFIG.min_material_roughness) {
                      mat.roughness = LIGHTING_CONFIG.min_material_roughness;
                    }

                    if (mat.emissive !== undefined) {
                      const p = currentPedestal;
                      if (mat.emissive.r < p && mat.emissive.g < p && mat.emissive.b < p) {
                        mat.emissive.setRGB(p, p, p);
                      }
                    }

                    if (mat.color && !mat._desaturated) {
                      const hsl = { h: 0, s: 0, l: 0 };
                      mat.color.getHSL(hsl);
                      hsl.s = Math.max(0.0, hsl.s * (1.0 - LIGHTING_CONFIG.albedo_desaturation));
                      mat.color.setHSL(hsl.h, hsl.s, hsl.l);
                      mat._desaturated = true;
                    }
                  });
                }
              });
            };

            const lumaBins = new Int32Array(16);

            const readyBtn = document.getElementById('readyBtn');
            const touchBlocker = document.getElementById('touchBlocker');

            if (readyBtn) {
              readyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isCalibrating || isCalibrated) return;

                if (window.XR8 && window.XR8.XrController) {
                  try { window.XR8.XrController.recenter(); } catch (err) {}
                }

                if (readyPrompt) {
                  readyPrompt.style.opacity = '0';
                  setTimeout(() => { readyPrompt.style.display = 'none'; }, 300);
                }

                isCalibrating = true;
                calibrationFramesDone = 0;
                accumulatedP98Samples.length = 0;
                accumulatedAvgLumSamples.length = 0;
                accumulatedWarmRatioSamples.length = 0;
              });
            }

            setInterval(() => {
              try {
                if (!video || video.readyState < 2 || !pmremGenerator) return;

                const now = performance.now();
                const deltaSec = Math.max(0.001, (now - lastFrameTime) / 1000.0);
                lastFrameTime = now;

                const shouldScan = !lightScanPaused && (isCalibrating || (now - lastScanTime >= LIGHTING_CONFIG.scan_interval_ms));

                if (shouldScan) {
                  lastScanTime = now;

                  const imgData = pmremCtx.getImageData(0, 0, pmremSize, pmremSize);
                  const data = imgData.data;
                  const scanEmitterHeight = Math.floor(pmremSize * LIGHTING_CONFIG.upper_half_limit);

                  let sumR = 0, sumG = 0, sumB = 0;
                  let maxLum = 0, maxLumX = pmremSize * 0.5, maxLumY = pmremSize * 0.3;
                  let count = 0, corePixelCount = 0, coreSumX = 0, coreSumY = 0;
                  let minCoreX = pmremSize, maxCoreX = 0, minCoreY = scanEmitterHeight, maxCoreY = 0;
                  let warmPixelsCount = 0;

                  const colorBins = new Int32Array(8);
                  const colorBinLumSumX = new Float32Array(8);
                  const colorBinLumSumY = new Float32Array(8);
                  const colorBinWeight = new Float32Array(8);
                  lumaBins.fill(0);

                  for (let idx = 0; idx < data.length; idx += 4) {
                    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                    const lum = (r * 0.299 + g * 0.587 + b * 0.114);
                    const pixelIdx = idx / 4;
                    const px = pixelIdx % pmremSize;
                    const py = Math.floor(pixelIdx / pmremSize);

                    sumR += r; sumG += g; sumB += b; count++;
                    const binIdx = Math.min(15, Math.floor((lum / 256) * 16));
                    lumaBins[binIdx]++;

                    if (lum > maxLum) { maxLum = lum; maxLumX = px; maxLumY = py; }

                    if (py < scanEmitterHeight && lum >= LIGHTING_CONFIG.emitter_lum_threshold) {
                      corePixelCount++; coreSumX += px; coreSumY += py;
                      if (px < minCoreX) minCoreX = px; if (px > maxCoreX) maxCoreX = px;
                      if (py < minCoreY) minCoreY = py; if (py > maxCoreY) maxCoreY = py;
                    }

                    // Evaluación de Calidez Global del píxel (Cr > Cb + 4 en espacio YCbCr)
                    const cb = -0.168736 * r - 0.331264 * g + 0.5 * b + 128;
                    const cr = 0.5 * r - 0.418688 * g - 0.081312 * b + 128;
                    if (lum >= 15 && cr > (cb + 4)) {
                      warmPixelsCount++;
                    }

                    const cBin = ((r > 100 ? 1 : 0) << 2) | ((g > 100 ? 1 : 0) << 1) | (b > 100 ? 1 : 0);
                    colorBins[cBin]++;
                    colorBinLumSumX[cBin] += px * lum;
                    colorBinLumSumY[cBin] += py * lum;
                    colorBinWeight[cBin] += lum;
                  }

                  const avgLum = count > 0 ? (sumR * 0.299 + sumG * 0.587 + sumB * 0.114) / count : 0;
                  const temporalDrop = previousAvgLum - avgLum;
                  previousAvgLum = avgLum;

                  let p90Lum = avgLum, p98Lum = avgLum, acc = 0;
                  const p90Target = count * 0.90, p98Target = count * 0.98;
                  for (let b = 0; b < 16; b++) {
                    acc += lumaBins[b];
                    if (acc >= p90Target && p90Lum === avgLum) p90Lum = ((b + 0.5) / 16) * 255;
                    if (acc >= p98Target) { p98Lum = ((b + 0.5) / 16) * 255; break; }
                  }

                  const currentWarmRatio = count > 0 ? (warmPixelsCount / count) : 0.0;

                  let dominantBin = 0, maxBinCount = 0;
                  for (let c = 0; c < 8; c++) {
                    if (colorBins[c] > maxBinCount) { maxBinCount = colorBins[c]; dominantBin = c; }
                  }

                  if (isCalibrating && !isCalibrated) {
                    accumulatedP98Samples.push(p98Lum);
                    accumulatedAvgLumSamples.push(avgLum);
                    accumulatedWarmRatioSamples.push(currentWarmRatio);
                    calibrationFramesDone++;

                    if (calibrationFramesDone >= LIGHTING_CONFIG.calibration_frames_target) {
                      isCalibrating = false;
                      isCalibrated = true;

                      const mediaPoblacionalPodada = (arr) => {
                        if (arr.length <= 2) return arr.reduce((a, b) => a + b, 0) / arr.length;
                        const ordenados = [...arr].sort((a, b) => a - b);
                        const podados = ordenados.slice(1, ordenados.length - 1);
                        return podados.reduce((a, b) => a + b, 0) / podados.length;
                      };

                      const avgP98 = mediaPoblacionalPodada(accumulatedP98Samples);
                      const avgLumFinal = mediaPoblacionalPodada(accumulatedAvgLumSamples);
                      const avgWarmRatio = mediaPoblacionalPodada(accumulatedWarmRatioSamples);

                      // Factores normalizados (0.0 = Día Máximo, 1.0 = Penumbra)
                      const p98Factor = Math.max(0.0, Math.min(1.0, 1.0 - (avgP98 - 110.0) / (225.0 - 110.0)));
                      const lumFactor = Math.max(0.0, Math.min(1.0, 1.0 - (avgLumFinal - 50.0) / (155.0 - 50.0)));

                      // Matriz de decisión: Lum (60%) + P98 (40%), modulada por cobertura cálida global
                      const isFullSceneWarm = (avgWarmRatio >= 0.70);

                      if (isFullSceneWarm) {
                        // Cobertura cálida >= 70%: Iluminación cálida de restaurante/velas
                        const warmWeight = 0.50;
                        const remainingWeight = 0.50;
                        const warmInfluence = 0.75;

                        environmentFactor = (lumFactor * 0.60 * remainingWeight) +
                                            (p98Factor * 0.40 * remainingWeight) +
                                            (warmInfluence * warmWeight);
                      } else {
                        // Cobertura cálida < 70%: Mesa o superficie cálida local
                        const warmWeight = 0.15;
                        const remainingWeight = 0.85;

                        environmentFactor = (lumFactor * 0.60 * remainingWeight) +
                                            (p98Factor * 0.40 * remainingWeight) +
                                            (lumFactor * warmWeight);
                      }

                      // Guardarraíles Cruzados y Clasificación Calibrada (v3.57)
                      let verdict = "DIA_NORMAL";
                      if (avgP98 > 225 && avgLumFinal > 140) {
                        environmentFactor = 0.0;
                        verdict = "DIRECCIONAL_FUERTE";
                      } else if (avgLumFinal > 155 || (environmentFactor < 0.30 && avgLumFinal >= 80)) {
                        environmentFactor = Math.max(0.25, Math.min(environmentFactor, 0.40));
                        verdict = "DIA_NORMAL";
                      } else if (environmentFactor < 0.65 || (avgP98 > 170 && avgLumFinal >= 75)) {
                        environmentFactor = Math.max(0.60, Math.min(environmentFactor, 0.75));
                        verdict = "AMBIENTE_SUAVE";
                      } else {
                        environmentFactor = Math.max(0.85, 1.0);
                        verdict = "PENUMBRA";
                      }

                      environmentFactor = Math.max(0.0, Math.min(1.0, environmentFactor));

                      // Interpolación Lineal Calibrada
                      currentDirectBudget = THREE_INSTANCE.MathUtils.lerp(LIGHTING_CONFIG.day_total_energy, LIGHTING_CONFIG.night_total_energy, environmentFactor);
                      currentPmremMult = THREE_INSTANCE.MathUtils.lerp(LIGHTING_CONFIG.day_pmrem_mult, LIGHTING_CONFIG.night_pmrem_mult, environmentFactor);
                      currentPedestal = THREE_INSTANCE.MathUtils.lerp(LIGHTING_CONFIG.day_pedestal, LIGHTING_CONFIG.night_pedestal, environmentFactor);

                      // Sombra dinámica: 4.0 en sol directo a 8.0 en penumbra (6.7 en ambiente suave)
                      const currentShadowRadius = THREE_INSTANCE.MathUtils.lerp(LIGHTING_CONFIG.day_shadow_radius, LIGHTING_CONFIG.night_shadow_radius, environmentFactor);
                      if (_baseLight1 && _baseLight1.shadow) {
                        _baseLight1.shadow.radius = currentShadowRadius;
                      }

                      actualizarHUDTelemetria(verdict, avgP98, avgLumFinal, avgWarmRatio * 100);

                      if (_activeCamera) {
                        let targetX2 = pmremSize * 0.5, targetY2 = pmremSize * 0.4;
                        if (maxBinCount > (count * 0.20) && colorBinWeight[dominantBin] > 0) {
                          targetX2 = colorBinLumSumX[dominantBin] / colorBinWeight[dominantBin];
                          targetY2 = colorBinLumSumY[dominantBin] / colorBinWeight[dominantBin];
                        }

                        const ndcX = (targetX2 / pmremSize) * 2 - 1;
                        const ndcY = 1 - (targetY2 / pmremSize) * 2;

                        _activeCamera.getWorldPosition(camWorldPos);
                        probeNDC.set(ndcX, ndcY, 0.5);
                        probeNDC.unproject(_activeCamera);
                        rayDir.subVectors(probeNDC, camWorldPos).normalize();

                        const elevAngle = LIGHTING_CONFIG.elevation_angle_light2;
                        const r = LIGHTING_CONFIG.light_distance;
                        const initY = Math.max(LIGHTING_CONFIG.min_light_height, Math.sin(elevAngle) * r);
                        const initXZ = Math.cos(elevAngle) * r;
                        const azimLen = Math.hypot(rayDir.x, rayDir.z) || 1.0;

                        const light2Pos = new THREE_INSTANCE.Vector3(
                          (rayDir.x / azimLen) * initXZ,
                          initY,
                          (rayDir.z / azimLen) * initXZ
                        );

                        iniciarTransicionRanura(slotLight2, currentDirectBudget * LIGHTING_CONFIG.weights_1_light[0], LIGHTING_CONFIG.transition_duration_ms, light2Pos, light2Pos.clone().normalize());
                        initialLightPlaced = true;
                        actualizarContadorLuces();

                        if (!isObjectPlaced && _ecsWorld) {
                          isObjectPlaced = true;

                          // v4.00: colocado el plato, pausamos el escaneo intensivo de luces y avisamos del asentamiento de escala
                          lightScanPaused = true;
                          window.metricScalePlacementTime = performance.now();
                          const scaleStatusEl = document.getElementById('scaleStatusText');
                          if (scaleStatusEl) scaleStatusEl.style.opacity = '1';

                          probeNDC.set(0, -0.25, 0.5);
                          probeNDC.unproject(_activeCamera);
                          const rDirPlacement = probeNDC.sub(camWorldPos).normalize();
                          placementRay.set(camWorldPos, rDirPlacement);

                          const spawnTarget = new THREE_INSTANCE.Vector3();
                          if (placementRay.intersectPlane(groundPlane, spawnTarget)) {
                            const forwardDir = new THREE_INSTANCE.Vector3(spawnTarget.x - camWorldPos.x, 0, spawnTarget.z - camWorldPos.z).normalize();
                            spawnTarget.addScaledVector(forwardDir, 0.05);
                            spawnTarget.y = 0.0;
                          } else {
                            const camDir = new THREE_INSTANCE.Vector3();
                            _activeCamera.getWorldDirection(camDir);
                            spawnTarget.set(camWorldPos.x + camDir.x * 0.45, 0.0, camWorldPos.z + camDir.z * 0.45);
                          }

                          try {
                            _ecsWorld.events.dispatch(_ecsWorld.events.globalId, "auto-place-dish", {
                              worldPosition: { x: spawnTarget.x, y: spawnTarget.y, z: spawnTarget.z }
                            });
                          } catch (err) {
                            log("Error colocación directa: " + err.message);
                          }
                        }
                      }

                      if (touchBlocker) touchBlocker.style.display = 'none';
                    }
                  }

                  const effectiveIlluminance = (avgLum * 0.30) + (p90Lum * 0.70);
                  smoothedBrightness = effectiveIlluminance;
                  const normalizedBrightness = Math.max(0.001, Math.min(1.0, smoothedBrightness / 255));
                  targetExposure = normalizedBrightness * currentPmremMult * LIGHTING_CONFIG.master_exposure_scale;
                  if (isNaN(targetExposure)) targetExposure = 0.45;

                  if (initialLightPlaced && !detectionPermanentlyStopped && _activeCamera) {
                    const candidateX = corePixelCount > 0 ? (coreSumX / corePixelCount) : maxLumX;
                    const candidateY = corePixelCount > 0 ? (coreSumY / corePixelCount) : maxLumY;

                    const getPixelLum = (px, py) => {
                      const cx = Math.max(0, Math.min(pmremSize - 1, Math.floor(px)));
                      const cy = Math.max(0, Math.min(pmremSize - 1, Math.floor(py)));
                      const pIdx = (cy * pmremSize + cx) * 4;
                      return data[pIdx] * 0.299 + data[pIdx + 1] * 0.587 + data[pIdx + 2] * 0.114;
                    };

                    const R = LIGHTING_CONFIG.halo_radius_px;
                    const coreLum = getPixelLum(candidateX, candidateY);
                    const sampleRightX = corePixelCount > 0 ? (maxCoreX + R) : (candidateX + R);
                    const sampleLeftX  = corePixelCount > 0 ? (minCoreX - R) : (candidateX - R);
                    const sampleDownY  = corePixelCount > 0 ? (maxCoreY + R) : (candidateY + R);
                    const sampleUpY    = corePixelCount > 0 ? (minCoreY - R) : (candidateY - R);

                    let steepDrops = 0;
                    if ((coreLum - getPixelLum(sampleRightX, candidateY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;
                    if ((coreLum - getPixelLum(sampleLeftX, candidateY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;
                    if ((coreLum - getPixelLum(candidateX, sampleDownY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;
                    if ((coreLum - getPixelLum(candidateX, sampleUpY)) >= LIGHTING_CONFIG.halo_drop_threshold) steepDrops++;

                    const hasRadialHalo = (steepDrops >= 2);
                    const hasCompactCore = corePixelCount >= LIGHTING_CONFIG.min_core_pixels;
                    const contrastDelta = coreLum - avgLum;
                    const hasSufficientContrast = (contrastDelta >= LIGHTING_CONFIG.contrast_delta_threshold) || (temporalDrop >= LIGHTING_CONFIG.temporal_drop_threshold);

                    const isConfirmedRealLight = (candidateY < scanEmitterHeight) && hasCompactCore && hasRadialHalo && hasSufficientContrast;

                    if (isConfirmedRealLight) {
                      const ndcX = (candidateX / pmremSize) * 2 - 1;
                      const ndcY = 1 - (candidateY / pmremSize) * 2;

                      _activeCamera.getWorldPosition(camWorldPos);
                      probeNDC.set(ndcX, ndcY, 0.5);
                      probeNDC.unproject(_activeCamera);
                      rayDir.subVectors(probeNDC, camWorldPos).normalize();

                      aplicarRestriccionesMesa(candidatePos, camWorldPos, rayDir, LIGHTING_CONFIG.light_distance);

                      let isInsideExistingCone = false;
                      carruselSlots.forEach(slot => {
                        if (slot.isAnchored && slot.state !== 'fading_out') {
                          if (rayDir.angleTo(slot.anchoredDir) < LIGHTING_CONFIG.min_separation_angle) {
                            isInsideExistingCone = true;
                          }
                        }
                      });

                      if (!isInsideExistingCone) {
                        if (candidateDebounce.active &&
                            Math.abs(candidateDebounce.screenX - candidateX) < 16 &&
                            Math.abs(candidateDebounce.screenY - candidateY) < 16) {
                          candidateDebounce.consecutiveCycles++;
                        } else {
                          candidateDebounce.active = true;
                          candidateDebounce.screenX = candidateX;
                          candidateDebounce.screenY = candidateY;
                          candidateDebounce.consecutiveCycles = 1;
                          candidateDebounce.dir.copy(rayDir);
                        }

                        if (candidateDebounce.consecutiveCycles >= LIGHTING_CONFIG.debounce_cycles) {
                          candidateDebounce.active = false;
                          candidateDebounce.consecutiveCycles = 0;

                          if (!slotLight3.isAnchored && slotLight3.state === 'idle') {
                            iniciarTransicionRanura(slotLight2, currentDirectBudget * LIGHTING_CONFIG.weights_2_lights[0], LIGHTING_CONFIG.transition_duration_ms);
                            iniciarTransicionRanura(slotLight3, currentDirectBudget * LIGHTING_CONFIG.weights_2_lights[1], LIGHTING_CONFIG.transition_duration_ms, candidatePos, rayDir);
                            totalRealLightsAnchored = 1;
                            totalLightsDetected = 2;
                            actualizarContadorLuces();
                          }
                          else if (!slotLight4.isAnchored && slotLight4.state === 'idle') {
                            iniciarTransicionRanura(slotLight2, 0.0, LIGHTING_CONFIG.transition_duration_ms);
                            iniciarTransicionRanura(slotLight3, currentDirectBudget * LIGHTING_CONFIG.weights_real_focus[0], LIGHTING_CONFIG.transition_duration_ms);
                            iniciarTransicionRanura(slotLight4, currentDirectBudget * LIGHTING_CONFIG.weights_real_focus[1], LIGHTING_CONFIG.transition_duration_ms, candidatePos, rayDir);
                            totalRealLightsAnchored = 2;
                            totalLightsDetected = 3;
                            actualizarContadorLuces();
                            detectionPermanentlyStopped = true;
                          }
                        }
                      } else {
                        candidateDebounce.active = false;
                        candidateDebounce.consecutiveCycles = 0;
                      }
                    }
                  }
                }

                if (now - lastPmremTime >= LIGHTING_CONFIG.pmrem_interval_ms) {
                  lastPmremTime = now;

                  pmremCtx.globalAlpha = LIGHTING_CONFIG.temporal_blend_alpha;
                  pmremCtx.drawImage(video, 0, 0, pmremSize, pmremSize);
                  pmremCtx.globalAlpha = 1.0;

                  envTexture.needsUpdate = true;
                  const oldRT = cameraRT;
                  cameraRT = pmremGenerator.fromEquirectangular(envTexture);
                  if (envMode === 'cam') scene.environment = cameraRT.texture;
                  if (oldRT) oldRT.dispose();
                }

                if (_activeCamera) {
                  _activeCamera.getWorldDirection(rayDir);
                  _activeCamera.getWorldPosition(camWorldPos);
                }

                carruselSlots.forEach(slot => {
                  if (!slot.light) return;
                  slot.light.target.position.set(0, 0, 0);

                  if (slot.state === 'transitioning' || slot.state === 'fading_out') {
                    const elapsed = now - slot.transition.startTime;
                    const progress = Math.min(1.0, elapsed / slot.transition.duration);
                    slot.light.intensity = THREE_INSTANCE.MathUtils.lerp(slot.transition.startIntensity, slot.transition.destIntensity, progress);

                    if (progress >= 1.0) {
                      if (slot.transition.destIntensity <= 0.0) {
                        slot.state = 'idle';
                        slot.isAnchored = false;
                        slot.light.intensity = 0.0;
                      } else {
                        slot.state = 'active';
                        slot.anchoredIntensity = slot.transition.destIntensity;
                      }
                    }
                  } else if (slot.state === 'active') {
                    const isFacing = _activeCamera ? (rayDir.angleTo(slot.anchoredDir) < LIGHTING_CONFIG.min_separation_angle) : true;
                    const effectiveTarget = isFacing
                      ? slot.anchoredIntensity
                      : (slot.anchoredIntensity * LIGHTING_CONFIG.out_of_frame_retention);

                    const rate = 1000.0 / LIGHTING_CONFIG.transition_duration_ms;
                    const lerpStep = 1.0 - Math.exp(-rate * deltaSec);
                    slot.light.intensity += (effectiveTarget - slot.light.intensity) * lerpStep;
                  } else if (slot.state === 'idle') {
                    slot.light.intensity = 0.0;
                  }
                });

                const expLerpStep = 1.0 - Math.exp(-LIGHTING_CONFIG.smoothing_rate * deltaSec);
                if (isNaN(renderer.toneMappingExposure)) renderer.toneMappingExposure = 1.0;
                renderer.toneMappingExposure += (targetExposure - renderer.toneMappingExposure) * expLerpStep;

                aplicarAjustesSceneViewer();

              } catch (e) {}
            }, 50);

          }
        }, 500);

      } catch (err) {
        log('Error PMREM nativo: ' + err.message);
      }
    }

    if (window.ecs) {
      const _i = ecs.application.init;
      ecs.application.init = c => {
        for (const k in c.objects) {
          const obj = c.objects[k];
          if (obj.name === 'Loading Screen') delete c.objects[k];

          if (obj.name === 'Directional Light') {
            if (obj.light) obj.light.intensity = 0.0;
          }

          if (obj.name === 'Model') {
            obj.scale = [1.01, 1.01, 1.01];
            const anim = obj.components['a2c75775-5a0f-44d7-910c-c111bc850bf6'];
            if (anim && anim.parameters) anim.parameters.toY = 0;
          }
          if (obj.name === 'Camera') {
            obj.components['scene-capturer-comp'] = {
              id: 'scene-capturer-comp',
              name: 'scene-capturer',
              parameters: {}
            };
          }
        }
        return _i.call(ecs.application, c);
      };
    }

    window.toggleEnv = function () {
      const btn = document.getElementById('envToggle');
      if (!_scene) return;

      if (envMode === 'hdr') {
        if (cameraRT) _scene.environment = cameraRT.texture;
        envMode = 'cam';
        if (btn) btn.innerText = 'Env: CAM';
      } else if (envMode === 'cam') {
        _scene.environment = null;
        envMode = 'off';
        if (btn) btn.innerText = 'Env: OFF';
      } else {
        if (originalEnv) {
          _scene.environment = originalEnv;
          envMode = 'hdr';
          if (btn) btn.innerText = 'Env: HDR';
        } else if (cameraRT) {
          _scene.environment = cameraRT.texture;
          envMode = 'cam';
          if (btn) btn.innerText = 'Env: CAM';
        } else {
          _scene.environment = null;
          envMode = 'off';
          if (btn) btn.innerText = 'Env: OFF';
        }
      }
    };
  </script>

  <script src="bundle-world.js"></script>
</body>
